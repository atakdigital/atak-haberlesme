<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAK Acil Afet Haberleşme Derneği - Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- AUTH CONTAINER -->
    <div id="auth-container" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex bg-red-600/20 text-red-500 p-4 rounded-2xl mb-4">
                    <i class="fa-solid fa-tower-broadcast text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">ATAK Haberleşme</h1>
                <p class="text-slate-400 text-sm mt-1">Acil Afet Derneği Yönetim ve Üye Portalı</p>
            </div>

            <div class="flex border-b border-slate-800 mb-6">
                <button type="button" id="tab-login-btn" onclick="switchAuth('login')" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-red-600 text-red-500 transition">Giriş Yap</button>
                <button type="button" id="tab-register-btn" onclick="switchAuth('register')" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">Kayıt Ol</button>
            </div>

            <form id="login-form" onsubmit="handleUserLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">E-posta Adresi</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-red-600">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer">Giriş Yap</button>
            </form>

            <form id="register-form" onsubmit="handleUserRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Ad Soyad</label>
                    <input type="text" id="reg-name" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Telsiz Çağrı Adı (Callsign)</label>
                    <input type="text" id="reg-callsign" placeholder="Örn: TA3XYZ" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">E-posta Adresi</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Şifre Belirle</label>
                    <input type="password" id="reg-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer">Kayıt Ol ve Başvur</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-container" class="hidden flex-1 flex flex-col lg:flex-row">
        <!-- SIDEBAR -->
        <aside class="w-full lg:w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
            <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                <div>
                    <h2 class="font-bold text-sm">ATAK Derneği</h2>
                    <p class="text-xs text-slate-400" id="user-role-badge">Yükleniyor...</p>
                </div>
            </div>
            <div class="px-4 pt-4 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Modüller</div>
            <nav class="flex-1 px-4 space-y-1">
                <button onclick="switchTab('dashboard')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-chart-pie w-5 text-red-500"></i><span>Genel Bakış</span>
                </button>
                <button id="nav-members" onclick="switchTab('members')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-users w-5 text-slate-400"></i><span>Üye Yönetimi</span>
                </button>
                <button onclick="switchTab('dues')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-wallet w-5 text-slate-400"></i><span>Aidat & Finans</span>
                </button>
                <button onclick="switchTab('telsiz')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-tower-broadcast w-5 text-slate-400"></i><span>Afet & Telsiz Sahası</span>
                </button>
                <button onclick="switchTab('reports')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-chart-line w-5 text-slate-400"></i><span>Raporlar</span>
                </button>
                <button onclick="switchTab('activities')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-map-location-dot w-5 text-slate-400"></i><span>Saha Faaliyetleri</span>
                </button>
                <button onclick="switchTab('announcements')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-bullhorn w-5 text-slate-400"></i><span>Duyurular</span>
                </button>
                <button onclick="switchTab('api')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition cursor-pointer">
                    <i class="fa-solid fa-code w-5 text-slate-400"></i><span>Mobil Uygulama & API</span>
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="handleUserLogout()" class="w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium text-red-400 hover:bg-red-500/10 transition cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket w-5"></i><span>Oturumu Kapat</span>
                </button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <div class="bg-red-600/20 text-red-500 p-2 rounded-xl"><i class="fa-solid fa-tower-broadcast text-lg"></i></div>
                    <div>
                        <h2 class="font-bold text-sm tracking-tight text-red-500">ATAK YÖNETİM PANELİ</h2>
                        <p class="text-[11px] text-slate-400">ACİL AFET HABERLEŞME DERNEĞİ</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="toggleEmergencyMode()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg text-xs transition shadow-lg flex items-center space-x-2 animate-pulse cursor-pointer">
                        <i class="fa-solid fa-triangle-exclamation"></i><span>AFET MODUNU TETİKLE</span>
                    </button>
                    <div class="text-right border-l border-slate-800 pl-4">
                        <p class="text-xs font-semibold text-slate-200" id="topbar-name">-</p>
                        <p class="text-[10px] text-red-400 font-medium" id="topbar-role">-</p>
                    </div>
                </div>
            </header>

            <div id="tab-content" class="flex-1 p-6 overflow-y-auto space-y-6"></div>
        </main>
    </div>

    <!-- UNIVERSAL MODAL -->
    <div id="universal-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-lg shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h3 id="modal-title" class="font-bold text-lg text-red-500">Form</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        const SUPABASE_URL = "https://iywgxfemglgixjplenyw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FNlMWgu7kmECpYbDLkC3BA_9emOSPy4";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        function switchAuth(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginBtn = document.getElementById('tab-login-btn');
            const registerBtn = document.getElementById('tab-register-btn');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-red-600 text-red-500 transition";
                registerBtn.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerBtn.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-500 transition";
                loginBtn.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
            }
        }

        async function handleUserLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert("Giriş Hatası: " + error.message);
            else checkUserSession();
        }

        async function handleUserRegister(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const fullName = document.getElementById('reg-name').value;
            const callsign = document.getElementById('reg-callsign').value;

            const { data, error } = await supabaseClient.auth.signUp({
                email, password,
                options: { data: { full_name: fullName, callsign: callsign } }
            });

            if (error) {
                alert("Kayıt Hatası: " + error.message);
            } else {
                if (data.user) {
                    await supabaseClient.from('members').insert([{
                        id: data.user.id, email, full_name: fullName, callsign, role: 'Normal Üye', status: 'Onay Bekliyor'
                    }]);
                }
                alert("Kayıt başarılı! Yönetim Kurulu Başkanının onayını bekleyiniz.");
                switchAuth('login');
            }
        }

        async function handleUserLogout() {
            await supabaseClient.auth.signOut();
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                const { data: member } = await supabaseClient.from('members').select('*').eq('id', session.user.id).single();
                if (member) {
                    currentUser = member;
                    document.getElementById('user-role-badge').innerText = member.role;
                    document.getElementById('topbar-name').innerText = member.full_name;
                    document.getElementById('topbar-role').innerText = member.role;

                    if (!['Yönetim Kurulu Başkanı', 'Başkan Yardımcısı', 'Sayman', 'Genel Sekreter'].includes(member.role)) {
                        const mBtn = document.getElementById('nav-members');
                        if (mBtn) mBtn.style.display = 'none';
                    }
                }
                switchTab('dashboard');
            }
        }

        function isManagement() {
            return currentUser && ['Yönetim Kurulu Başkanı', 'Başkan Yardımcısı', 'Sayman'].includes(currentUser.role);
        }

        function openModal(title, htmlContent) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = htmlContent;
            document.getElementById('universal-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('universal-modal').classList.add('hidden');
        }

        function toggleEmergencyMode() {
            alert("DİKKAT: Afet Modu / Kırmızı Kod tetiklendi! Tüm saha ekiplerine acil durum sinyali gönderildi.");
        }

        function switchTab(tabName) {
            const content = document.getElementById('tab-content');

            if (tabName === 'dashboard') {
                content.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><p class="text-slate-400 text-xs">Toplam Onaylı Üye</p><h3 id="stat-active" class="text-2xl font-bold mt-1 text-emerald-400">-</h3><p class="text-[10px] text-slate-500 mt-1">Aktif Telsiz Operatörleri</p></div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><p class="text-slate-400 text-xs">Toplam Aidat Tahsilatı</p><h3 id="stat-dues" class="text-2xl font-bold mt-1 text-blue-400">-</h3><p class="text-[10px] text-slate-500 mt-1">2026 Sezonu</p></div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><p class="text-slate-400 text-xs">Aktif Saha Faaliyetleri</p><h3 id="stat-activities" class="text-2xl font-bold mt-1 text-purple-400">-</h3><p class="text-[10px] text-slate-500 mt-1">Tatbikat & Röle Bakımı</p></div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><p class="text-slate-400 text-xs">Onay Bekleyen Üye</p><h3 id="stat-pending" class="text-2xl font-bold mt-1 text-amber-400">-</h3><p class="text-[10px] text-slate-500 mt-1">Başkan Onayı Bekleniyor</p></div>
                    </div>
                `;
                loadDashboardStats();
            } else if (tabName === 'members') {
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                        <h3 class="font-bold text-lg mb-4">Üye Yönetimi ve Onaylar</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="border-b border-slate-800 text-slate-400">
                                    <tr><th class="pb-3">Ad Soyad</th><th class="pb-3">Çağrı Adı</th><th class="pb-3">E-posta</th><th class="pb-3">Rol</th><th class="pb-3">Durum</th><th class="pb-3">İşlemler</th></tr>
                                </thead>
                                <tbody id="members-table-body">
                                    <tr><td colspan="6" class="py-4 text-center text-slate-400">Yükleniyor...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                loadMembersTable();
            } else if (tabName === 'dues') {
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg">Aidat & Finans Takibi</h3>
                            ${isManagement() ? `<button onclick="showAddDueModal()" class="bg-red-600 hover:bg-red-700 text-xs px-4 py-2 rounded-lg font-semibold transition cursor-pointer">+ Aidat Ekle</button>` : ''}
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="border-b border-slate-800 text-slate-400">
                                    <tr><th class="pb-3">Üye Adı</th><th class="pb-3">Dönem / Ay</th><th class="pb-3">Tutar</th><th class="pb-3">Durum</th>${isManagement() ? '<th class="pb-3">İşlem</th>' : ''}</tr>
                                </thead>
                                <tbody id="dues-table-body">
                                    <tr><td colspan="5" class="py-4 text-center text-slate-400">Yükleniyor...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                loadDuesTable();
            } else if (tabName === 'telsiz') {
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-lg text-red-400"><i class="fa-solid fa-tower-broadcast"></i> Afet & Telsiz Haberleşme Frekansları</h3>
                            ${isManagement() ? `<button onclick="showAddRepeaterModal()" class="bg-red-600 hover:bg-red-700 text-xs px-4 py-2 rounded-lg font-semibold transition cursor-pointer">+ Röle / Frekans Ekle</button>` : ''}
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4" id="repeaters-grid">
                            <p class="text-slate-400 text-sm">Röleler yükleniyor...</p>
                        </div>
                    </div>
                `;
                loadRepeaters();
            } else if (tabName === 'reports') {
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-lg text-slate-100">Gelişmiş Raporlar ve Analizler</h3>
                            ${isManagement() ? `<button onclick="showAddReportModal()" class="bg-red-600 hover:bg-red-700 text-xs px-4 py-2 rounded-lg font-semibold transition cursor-pointer">+ Rapor / Belge Ekle</button>` : ''}
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="border-b border-slate-800 text-slate-400">
                                    <tr><th class="pb-3">Rapor Adı</th><th class="pb-3">Kategori</th><th class="pb-3">Tarih</th>${isManagement() ? '<th class="pb-3">İşlem</th>' : ''}</tr>
                                </thead>
                                <tbody id="reports-table-body">
                                    <tr><td colspan="4" class="py-4 text-center text-slate-400">Raporlar yükleniyor...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                loadReportsTable();
            } else if (tabName === 'activities') {
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg">Saha Faaliyetleri ve Tatbikatlar</h3>
                            ${isManagement() ? `<button onclick="showAddActivityModal()" class="bg-red-600 hover:bg-red-700 text-xs px-4 py-2 rounded-lg font-semibold transition cursor-pointer">+ Faaliyet Ekle</button>` : ''}
                        </div>
                        <div class="space-y-3" id="activities-list"><p class="text-slate-400 text-sm">Faaliyetler yükleniyor...</p></div>
                    </div>
                `;
                loadActivities();
            } else if (tabName === 'announcements') {
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg">Dernek İçi Duyurular</h3>
                            ${isManagement() ? `<button onclick="showAddAnnouncementModal()" class="bg-red-600 hover:bg-red-700 text-xs px-4 py-2 rounded-lg font-semibold transition cursor-pointer">+ Duyuru Yayınla</button>` : ''}
                        </div>
                        <div class="space-y-3" id="announcements-list"><p class="text-slate-400 text-sm">Duyurular yükleniyor...</p></div>
                    </div>
                `;
                loadAnnouncements();
            } else if (tabName === 'api') {
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
                        <h3 class="font-bold text-lg text-blue-400"><i class="fa-solid fa-code"></i> Mobil Uygulama & API</h3>
                        <p class="text-slate-400 text-sm">Supabase REST uç noktaları aktif.</p>
                    </div>
                `;
            }
        }

        async function loadDashboardStats() {
            const { data: members } = await supabaseClient.from('members').select('*');
            if (members) {
                document.getElementById('stat-active').innerText = members.filter(m => m.status === 'Aktif').length;
                document.getElementById('stat-pending').innerText = members.filter(m => m.status === 'Onay Bekliyor').length;
            }
            const { data: dues } = await supabaseClient.from('dues').select('amount');
            const totalDues = dues ? dues.reduce((sum, d) => sum + (d.amount || 0), 0) : 0;
            document.getElementById('stat-dues').innerText = "₺" + totalDues.toLocaleString();

            const { data: acts } = await supabaseClient.from('field_activities').select('*');
            document.getElementById('stat-activities').innerText = acts ? acts.length : 0;
        }

        async function loadMembersTable() {
            const { data: members } = await supabaseClient.from('members').select('*');
            const tbody = document.getElementById('members-table-body');
            if (!members) return;
            tbody.innerHTML = members.map(m => `
                <tr class="border-b border-slate-800/50 hover:bg-slate-800/20">
                    <td class="py-3 font-medium">${m.full_name}</td>
                    <td class="py-3 text-red-400 font-mono">${m.callsign || '-'}</td>
                    <td class="py-3 text-slate-400">${m.email}</td>
                    <td class="py-3">
                        <select onchange="updateMemberRole('${m.id}', this.value)" class="bg-slate-950 border border-slate-800 text-xs rounded px-2 py-1">
                            <option ${m.role === 'Normal Üye' ? 'selected' : ''}>Normal Üye</option>
                            <option ${m.role === 'Sayman' ? 'selected' : ''}>Sayman</option>
                            <option ${m.role === 'Genel Sekreter' ? 'selected' : ''}>Genel Sekreter</option>
                            <option ${m.role === 'Başkan Yardımcısı' ? 'selected' : ''}>Başkan Yardımcısı</option>
                            <option ${m.role === 'Yönetim Kurulu Başkanı' ? 'selected' : ''}>Yönetim Kurulu Başkanı</option>
                        </select>
                    </td>
                    <td class="py-3"><span class="px-2 py-1 rounded text-xs ${m.status === 'Aktif' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'}">${m.status}</span></td>
                    <td class="py-3 space-x-2">
                        ${m.status === 'Onay Bekliyor' ? `<button onclick="approveMember('${m.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-xs px-3 py-1 rounded cursor-pointer">Onayla</button>` : ''}
                        <button onclick="deleteMember('${m.id}')" class="text-red-400 hover:text-red-300 text-xs cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadDuesTable() {
            let query = supabaseClient.from('dues').select('*, members(full_name)');
            if (!isManagement()) query = query.eq('member_id', currentUser.id);
            const { data: dues } = await query;
            const tbody = document.getElementById('dues-table-body');
            if (!dues || dues.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">Aidat kaydı bulunamadı.</td></tr>`;
                return;
            }
            tbody.innerHTML = dues.map(d => `
                <tr class="border-b border-slate-800/50 hover:bg-slate-800/20">
                    <td class="py-3 font-medium">${d.members?.full_name || 'Üye'}</td>
                    <td class="py-3">${d.period || '2026 Sezonu'}</td>
                    <td class="py-3 text-blue-400 font-mono">${d.amount || 0} ₺</td>
                    <td class="py-3"><span class="px-2 py-1 rounded text-xs ${d.status === 'Ödendi' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}">${d.status || 'Ödenmedi'}</span></td>
                    ${isManagement() ? `<td class="py-3"><button onclick="deleteDue('${d.id}')" class="text-red-400 hover:text-red-300 text-xs cursor-pointer p-1"><i class="fa-solid fa-trash"></i></button></td>` : ''}
                </tr>
            `).join('');
        }

        async function loadRepeaters() {
            const { data: repeaters } = await supabaseClient.from('repeaters').select('*');
            const container = document.getElementById('repeaters-grid');
            if (!repeaters || repeaters.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-sm">Kayıtlı röle istasyonu bulunmuyor.</p>`;
                return;
            }
            container.innerHTML = repeaters.map(r => `
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 relative">
                    <h4 class="font-bold text-red-500">${r.name}</h4>
                    <p class="text-xs text-slate-400 mt-1">Frekans: ${r.frequency}</p>
                    <p class="text-xs text-slate-400">Tone: ${r.tone || '-'}</p>
                    <p class="text-xs text-slate-400">Konum: ${r.location || '-'}</p>
                    ${isManagement() ? `<button onclick="deleteRepeater('${r.id}')" class="absolute top-3 right-3 text-red-400 hover:text-red-300 text-xs cursor-pointer p-1"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
            `).join('');
        }

        async function loadReportsTable() {
            const { data: reports } = await supabaseClient.from('reports').select('*');
            const tbody = document.getElementById('reports-table-body');
            if (!reports || reports.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">Kayıtlı rapor bulunmuyor.</td></tr>`;
                return;
            }
            tbody.innerHTML = reports.map(r => `
                <tr class="border-b border-slate-800/50 hover:bg-slate-800/20">
                    <td class="py-3 font-medium text-slate-200">${r.title}</td>
                    <td class="py-3 text-slate-400">${r.category || 'Genel'}</td>
                    <td class="py-3 text-slate-400">${new Date(r.created_at).toLocaleDateString('tr-TR')}</td>
                    ${isManagement() ? `<td class="py-3"><button onclick="deleteReport('${r.id}')" class="text-red-400 hover:text-red-300 text-xs cursor-pointer p-1"><i class="fa-solid fa-trash"></i></button></td>` : ''}
                </tr>
            `).join('');
        }

        async function loadActivities() {
            const { data: acts } = await supabaseClient.from('field_activities').select('*');
            const container = document.getElementById('activities-list');
            if (!acts || acts.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-sm">Kayıtlı saha faaliyeti bulunmuyor.</p>`;
                return;
            }
            container.innerHTML = acts.map(a => `
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <div class="flex items-center space-x-2">
                            <h4 class="font-bold text-sm text-red-400">${a.title}</h4>
                            <span class="bg-red-500/10 text-red-400 text-[10px] px-2 py-0.5 rounded">${a.type || 'Tatbikat'}</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-1">${a.description || ''} • <span class="text-slate-300 font-semibold">${a.location || ''}</span></p>
                    </div>
                    ${isManagement() ? `<button onclick="deleteActivity('${a.id}')" class="text-red-400 hover:text-red-300 text-xs cursor-pointer p-1"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
            `).join('');
        }

        async function loadAnnouncements() {
            const { data: anns } = await supabaseClient.from('announcements').select('*');
            const container = document.getElementById('announcements-list');
            if (!anns || anns.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-sm">Aktif duyuru bulunmuyor.</p>`;
                return;
            }
            container.innerHTML = anns.map(ann => `
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm text-blue-400">${ann.title}</h4>
                        <p class="text-xs text-slate-400 mt-1">${ann.content || ''}</p>
                        <p class="text-[10px] text-slate-500 mt-1">Yayınlayan: ${ann.author || 'Yönetim'}</p>
                    </div>
                    ${isManagement() ? `<button type="button" onclick="deleteAnnouncement('${ann.id}')" class="text-red-400 hover:text-red-300 text-xs cursor-pointer p-2"><i class="fa-solid fa-trash text-sm"></i></button>` : ''}
                </div>
            `).join('');
        }

        // MODAL FORMLARI
        async function showAddDueModal() {
            const { data: members } = await supabaseClient.from('members').select('id, full_name');
            const options = members ? members.map(m => `<option value="${m.id}">${m.full_name}</option>`).join('') : '';

            openModal("Yeni Aidat Kaydı Ekle", `
                <form onsubmit="handleAddDue(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Üye Seçin</label>
                        <select id="due-member-id" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200">
                            ${options}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Aidat Tutarı (₺)</label>
                        <input type="number" id="due-amount" required value="500" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Dönem / Sezon</label>
                        <input type="text" id="due-period" required value="2026 Sezonu" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer">Aidatı Kaydet</button>
                </form>
            `);
        }

        function showAddRepeaterModal() {
            openModal("Yeni Röle İstasyonu Ekle", `
                <form onsubmit="handleAddRepeater(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Röle Adı</label>
                        <input type="text" id="rpt-name" required placeholder="Örn: Marmara Röle (RPT-1)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Frekans</label>
                        <input type="text" id="rpt-freq" required placeholder="Örn: 145.750 MHz" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Tone (CTCSS)</label>
                        <input type="text" id="rpt-tone" placeholder="Örn: 88.5 Hz" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Konum / Bölge</label>
                        <input type="text" id="rpt-loc" placeholder="Örn: Bursa" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer">Röleyi Kaydet</button>
                </form>
            `);
        }

        function showAddReportModal() {
            openModal("Yeni Rapor / Belge Ekle", `
                <form onsubmit="handleAddReport(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Rapor Başlığı</label>
                        <input type="text" id="rep-title" required placeholder="Örn: 2026 1. Dönem Faaliyet Raporu" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Kategori</label>
                        <select id="rep-cat" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200">
                            <option value="Mali Rapor">Mali Rapor</option>
                            <option value="Operasyonel Rapor">Operasyonel Rapor</option>
                            <option value="Tatbikat Sonucu">Tatbikat Sonucu</option>
                            <option value="Genel Kurul">Genel Kurul</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer">Raporu Kaydet</button>
                </form>
            `);
        }

        function showAddActivityModal() {
            openModal("Yeni Saha Faaliyeti Ekle", `
                <form onsubmit="handleAddActivity(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Faaliyet Başlığı</label>
                        <input type="text" id="act-title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Faaliyet Türü</label>
                        <select id="act-type" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200">
                            <option value="Tatbikat">Tatbikat</option>
                            <option value="Saha Görevi">Saha Görevi</option>
                            <option value="Röle Bakımı">Röle Bakımı</option>
                            <option value="Eğitim">Eğitim</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Açıklama</label>
                        <textarea id="act-desc" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Konum / Bölge</label>
                        <input type="text" id="act-loc" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer">Faaliyeti Kaydet</button>
                </form>
            `);
        }

        function showAddAnnouncementModal() {
            openModal("Yeni Duyuru Yayınla", `
                <form onsubmit="handleAddAnnouncement(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Duyuru Başlığı</label>
                        <input type="text" id="ann-title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">İçerik</label>
                        <textarea id="ann-content" rows="4" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition cursor-pointer">Duyuruyu Yayınla</button>
                </form>
            `);
        }

        // VERİTABANI İŞLEMLERİ
        async function handleAddDue(e) {
            e.preventDefault();
            const member_id = document.getElementById('due-member-id').value;
            const amount = parseFloat(document.getElementById('due-amount').value);
            const period = document.getElementById('due-period').value;
            const receipt_no = "ATAK-" + Math.floor(100000 + Math.random() * 900000);

            const { error } = await supabaseClient.from('dues').insert([{ member_id, amount, period, receipt_no, status: 'Ödendi' }]);
            if (error) alert("Hata: " + error.message);
            else { closeModal(); loadDuesTable(); }
        }

        async function handleAddRepeater(e) {
            e.preventDefault();
            const name = document.getElementById('rpt-name').value;
            const frequency = document.getElementById('rpt-freq').value;
            const tone = document.getElementById('rpt-tone').value;
            const location = document.getElementById('rpt-loc').value;

            const { error } = await supabaseClient.from('repeaters').insert([{ name, frequency, tone, location }]);
            if (error) alert("Hata: " + error.message);
            else { closeModal(); loadRepeaters(); }
        }

        async function handleAddReport(e) {
            e.preventDefault();
            const title = document.getElementById('rep-title').value;
            const category = document.getElementById('rep-cat').value;

            const { error } = await supabaseClient.from('reports').insert([{ title, category }]);
            if (error) alert("Hata: " + error.message);
            else { closeModal(); loadReportsTable(); }
        }

        async function handleAddActivity(e) {
            e.preventDefault();
            const title = document.getElementById('act-title').value;
            const type = document.getElementById('act-type').value;
            const description = document.getElementById('act-desc').value;
            const location = document.getElementById('act-loc').value;
            const leader = currentUser ? currentUser.full_name : 'Yönetim';

            const { error } = await supabaseClient.from('field_activities').insert([{ title, type, description, location, leader }]);
            if (error) alert("Hata: " + error.message);
            else { closeModal(); loadActivities(); }
        }

        async function handleAddAnnouncement(e) {
            e.preventDefault();
            const title = document.getElementById('ann-title').value;
            const content = document.getElementById('ann-content').value;
            const author = currentUser ? currentUser.full_name : 'Yönetim';

            const { error } = await supabaseClient.from('announcements').insert([{ title, content, author }]);
            if (error) alert("Hata: " + error.message);
            else { closeModal(); loadAnnouncements(); }
        }

        // GLOBAL SİLME FONKSİYONLARI
        window.deleteDue = async function(id) {
            if (confirm("Bu aidat kaydını silmek istediğinize emin misiniz?")) {
                const { error } = await supabaseClient.from('dues').delete().eq('id', id);
                if (error) alert("Silme Hatası: " + error.message);
                else loadDuesTable();
            }
        };

        window.deleteRepeater = async function(id) {
            if (confirm("Bu röleyi silmek istediğinize emin misiniz?")) {
                const { error } = await supabaseClient.from('repeaters').delete().eq('id', id);
                if (error) alert("Silme Hatası: " + error.message);
                else loadRepeaters();
            }
        };

        window.deleteReport = async function(id) {
            if (confirm("Bu raporu silmek istediğinize emin misiniz?")) {
                const { error } = await supabaseClient.from('reports').delete().eq('id', id);
                if (error) alert("Silme Hatası: " + error.message);
                else loadReportsTable();
            }
        };

        window.deleteActivity = async function(id) {
            if (confirm("Bu faaliyeti silmek istediğinize emin misiniz?")) {
                const { error } = await supabaseClient.from('field_activities').delete().eq('id', id);
                if (error) alert("Silme Hatası: " + error.message);
                else loadActivities();
            }
        };

        window.deleteAnnouncement = async function(id) {
            if (confirm("Bu duyuruyu silmek istediğinize emin misiniz?")) {
                const { error } = await supabaseClient.from('announcements').delete().eq('id', id);
                if (error) alert("Silme Hatası: " + error.message);
                else loadAnnouncements();
            }
        };

        window.approveMember = async function(id) {
            await supabaseClient.from('members').update({ status: 'Aktif' }).eq('id', id);
            loadMembersTable();
        };

        window.updateMemberRole = async function(id, role) {
            await supabaseClient.from('members').update({ role: role }).eq('id', id);
        };

        window.deleteMember = async function(id) {
            if (confirm("Bu üyeyi silmek istediğinize emin misiniz?")) {
                await supabaseClient.from('members').delete().eq('id', id);
                loadMembersTable();
            }
        };

        window.onload = checkUserSession;
    </script>
</body>
</html>
