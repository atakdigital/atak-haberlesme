<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAK Acil Afet Haberleşme Derneği - Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- AUTH CONTAINER -->
    <div id="auth-container" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex bg-red-600/20 text-red-500 p-4 rounded-2xl mb-4">
                    <i class="fa-solid fa-tower-broadcast text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">ATAK Haberleşme</h1>
                <p class="text-slate-400 text-sm mt-1">Acil Afet Derneği Yönetim ve Üye Portalı</p>
            </div>

            <div class="flex border-b border-slate-800 mb-6">
                <button type="button" id="tab-login-btn" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-red-600 text-red-500 transition">Giriş Yap</button>
                <button type="button" id="tab-register-btn" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">Kayıt Ol</button>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">E-posta Adresi</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-red-600">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition">Giriş Yap</button>
            </form>

            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Ad Soyad</label>
                    <input type="text" id="reg-name" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Telsiz Çağrı Adı (Callsign)</label>
                    <input type="text" id="reg-callsign" placeholder="Örn: TA3XYZ" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">E-posta Adresi</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Şifre Belirle</label>
                    <input type="password" id="reg-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 font-semibold py-2.5 rounded-lg text-sm transition">Kayıt Ol ve Başvur</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-container" class="hidden flex-1 flex flex-col lg:flex-row">
        <aside class="w-full lg:w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
            <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-red-600 p-2 rounded-lg text-white">
                        <i class="fa-solid fa-tower-broadcast"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm">ATAK Derneği</h2>
                        <p class="text-xs text-slate-400" id="user-role-badge">Yükleniyor...</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <button onclick="switchTab('dashboard')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chart-pie w-5"></i><span>Genel Bakış</span>
                </button>
                <button onclick="switchTab('members')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-users w-5"></i><span>Üye Yönetimi</span>
                </button>
                <button onclick="switchTab('dues')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-wallet w-5"></i><span>Aidat Takibi</span>
                </button>
                <button onclick="switchTab('activities')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-map-location-dot w-5"></i><span>Saha Faaliyetleri</span>
                </button>
                <button onclick="switchTab'
