<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAK Acil Afet Haberleşme Derneği - Yönetim Paneli</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        atak: {
                            red: '#DC2626',
                            redDark: '#991B1B',
                            darkBg: '#0F172A',
                            cardBg: '#1E293B',
                            border: '#334155',
                            gold: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
            color: #F8FAFC;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .disaster-pulse { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <!-- SCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = "https://iywgxfemglgixjplenyw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FNlMWgu7kmECpYbDLkC3BA_9emOSPy4";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let state = {
            currentUser: null,
            users: [],
            fees: [],
            announcements: [],
            activities: [],
            repeaters: [],
            reports: [],
            disasterMode: false,
            activeTab: 'dashboard',
            mobileTab: 'home',
            notification: null
        };

        function showNotification(msg, type = 'success') {
            state.notification = { msg, type };
            render();
            setTimeout(() => { state.notification = null; render(); }, 3500);
        }

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: member } = await supabaseClient.from('members').select('*').eq('id', session.user.id).single();
                if (member) {
                    state.currentUser = member;
                } else {
                    state.currentUser = { id: session.user.id, full_name: session.user.email, role: 'Normal Üye', callsign: 'TA1XXX', blood: '0 Rh+' };
                }
            }
            await fetchAllData();
            render();
        }

        async function fetchAllData() {
            const [mRes, dRes, aRes, rRes, repRes, repPortRes] = await Promise.all([
                supabaseClient.from('members').select('*'),
                supabaseClient.from('dues').select('*, members(full_name)'),
                supabaseClient.from('announcements').select('*'),
                supabaseClient.from('field_activities').select('*'),
                supabaseClient.from('repeaters').select('*'),
                supabaseClient.from('reports').select('*')
            ]);

            if (mRes.data) state.users = mRes.data;
            if (dRes.data) state.fees = dRes.data.map(d => ({ id: d.id, memberName: d.members?.full_name || 'Üye', amount: d.amount, date: d.created_at?.split('T')[0] || '2026', method: 'Banka Havalesi' }));
            if (aRes.data) state.announcements = aRes.data;
            if (rRes.data) state.activities = rRes.data;
            if (repRes.data) state.repeaters = repRes.data;
            if (repPortRes.data) state.reports = repPortRes.data;
        }

        function toggleDisasterMode() {
            state.disasterMode = !state.disasterMode;
            if (state.disasterMode) {
                showNotification('🚨 Kırmızı Alarm! Afet modu tüm sistemlerde aktifleştirildi.', 'danger');
            } else {
                showNotification('Afet modu kapatıldı. Normal operasyona dönüldü.', 'info');
            }
            render();
        }

        function hasPermission(permission) {
            if (!state.currentUser) return false;
            const role = state.currentUser.role;
            const managementRoles = ['Yönetim Kurulu Başkanı', 'Başkan Yardımcısı', 'Genel Sekreter', 'Sayman'];
            return managementRoles.includes(role);
        }

        // --- AUTH FORMS ---
        async function handleLogin(e) {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                showNotification("Giriş Hatası: " + error.message, 'danger');
            } else {
                await checkSession();
                showNotification("Başarıyla giriş yapıldı.");
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const form = e.target;
            const email = form.email.value;
            const password = form.password.value;
            const name = form.name.value;
            const callsign = form.callsign.value.toUpperCase();
            const blood = form.blood.value;

            const { data, error } = await supabaseClient.auth.signUp({
                email, password,
                options: { data: { full_name: name, callsign } }
            });

            if (error) {
                showNotification("Kayıt Hatası: " + error.message, 'danger');
            } else {
                if (data.user) {
                    await supabaseClient.from('members').insert([{
                        id: data.user.id, email, full_name: name, callsign, blood, role: 'Normal Üye', status: 'Onay Bekliyor'
                    }]);
                }
                showNotification('Kayıt başvurunuz alındı. Yönetim onayından sonra giriş yapabilirsiniz.', 'warning');
                form.reset();
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            state.currentUser = null;
            render();
        }

        // --- RENDER LAYOUTS ---
        function renderNotification() {
            if (!state.notification) return '';
            const bg = state.notification.type === 'danger' ? 'bg-red-600' : state.notification.type === 'warning' ? 'bg-amber-600' : 'bg-emerald-600';
            return `
                <div class="fixed top-5 right-5 z-50 ${bg} text-white px-5 py-3 rounded-lg shadow-2xl flex items-center space-x-3 transition-all">
                    <i class="fa-solid ${state.notification.type === 'danger' ? 'fa-triangle-exclamation' : 'fa-circle-check'} text-xl"></i>
                    <span class="font-medium text-sm">${state.notification.msg}</span>
                </div>
            `;
        }

        function renderAuthScreen() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-red-950">
                    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
                        <div class="p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-800">
                            <div>
                                <div class="flex items-center space-x-3 mb-6">
                                    <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-red-600/30">
                                        <i class="fa-solid fa-radio"></i>
                                    </div>
                                    <div>
                                        <h1 class="font-extrabold text-xl tracking-wider text-white">ATAK DERNEĞİ</h1>
                                        <p class="text-xs text-red-500 font-semibold tracking-widest">ACİL AFET HABERLEŞME</p>
                                    </div>
                                </div>
                                <h2 class="text-lg font-bold text-slate-200 mb-4">Yönetim Paneli Girişi</h2>
                                <form onsubmit="handleLogin(event)" class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">E-posta Adresi</label>
                                        <input type="email" name="email" required placeholder="ornek@atak.org.tr" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-red-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label>
                                        <input type="password" name="password" required placeholder="••••••" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-red-500">
                                    </div>
                                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg shadow-red-600/30 cursor-pointer">
                                        Giriş Yap <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div class="p-8 bg-slate-900/50">
                            <h2 class="text-lg font-bold text-slate-200 mb-1">Yeni Üye Kaydı</h2>
                            <p class="text-xs text-slate-400 mb-4">Üyelik başvurunuz Yönetim Kurulu onayına sunulacaktır.</p>
                            <form onsubmit="handleRegister(event)" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-medium text-slate-400 mb-1">Ad Soyad</label>
                                    <input type="text" name="name" required placeholder="Ahmet Yılmaz" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-red-500">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Callsign</label>
                                        <input type="text" name="callsign" placeholder="TA1XXX" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-red-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Kan Grubu</label>
                                        <select name="blood" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-red-500">
                                            <option>A Rh+</option><option>A Rh-</option><option>B Rh+</option><option>B Rh-</option>
                                            <option>0 Rh+</option><option>0 Rh-</option><option>AB Rh+</option><option>AB Rh-</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-400 mb-1">E-posta</label>
                                    <input type="email" name="email" required placeholder="ornek@mail.com" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-red-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label>
                                    <input type="password" name="password" required placeholder="••••••" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-red-500">
                                </div>
                                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-2 rounded-lg text-sm transition mt-2 cursor-pointer">
                                    Üyelik Başvurusu Gönder
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHeader() {
            return `
                <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between sticky top-0 z-40">
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 bg-red-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md shadow-red-600/30">
                                <i class="fa-solid fa-radio"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-slate-100 tracking-wide text-base leading-tight">ATAK YÖNETİM PANELİ</h1>
                                <p class="text-[10px] text-red-500 font-bold tracking-widest uppercase">Acil Afet Haberleşme Derneği</p>
                            </div>
                        </div>
                        <button onclick="toggleDisasterMode()" class="ml-6 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-2 ${state.disasterMode ? 'bg-red-600 text-white disaster-pulse animate-bounce' : 'bg-red-950/40 text-red-400 border border-red-800 hover:bg-red-900/60'} cursor-pointer">
                            <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                            <span>${state.disasterMode ? 'AFET MODU AKTİF (KAPAT)' : 'AFET MODUNU TETİKLE'}</span>
                        </button>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="text-right hidden sm:block">
                            <div class="text-sm font-semibold text-slate-200 flex items-center justify-end space-x-2">
                                <span>${state.currentUser.full_name}</span>
                                <span class="bg-red-950 border border-red-800 text-red-400 text-[10px] px-1.5 py-0.5 rounded font-mono">${state.currentUser.callsign || 'TA1XXX'}</span>
                            </div>
                            <div class="text-xs text-amber-500 font-medium">${state.currentUser.role}</div>
                        </div>
                        <button onclick="handleLogout()" title="Çıkış Yap" class="w-9 h-9 bg-slate-800 hover:bg-red-900/50 hover:text-red-400 border border-slate-700 rounded-lg flex items-center justify-center text-slate-300 transition cursor-pointer">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </header>
            `;
        }

        function renderSidebar() {
            const tabs = [
                { id: 'dashboard', label: 'Genel Bakış', icon: 'fa-chart-pie' },
                { id: 'users', label: 'Üye Yönetimi', icon: 'fa-users' },
                { id: 'fees', label: 'Aidat & Finans', icon: 'fa-wallet' },
                { id: 'radio', label: 'Afet & Telsiz Sahası', icon: 'fa-tower-cell' },
                { id: 'reports', label: 'Raporlar', icon: 'fa-chart-column' },
                { id: 'activities', label: 'Saha Faaliyetleri', icon: 'fa-person-hiking' },
                { id: 'announcements', label: 'Duyurular', icon: 'fa-bullhorn' },
                { id: 'mobile', label: 'Mobil Uygulama & API', icon: 'fa-mobile-screen-button' }
            ];

            const pendingCount = state.users.filter(u => u.status === 'Onay Bekliyor').length;

            return `
                <aside class="w-full md:w-64 bg-slate-900/70 border-r border-slate-800 flex flex-col shrink-0">
                    <div class="p-4 space-y-1 flex-1">
                        <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider px-3 mb-2">Modüller</div>
                        ${tabs.map(tab => `
                            <button onclick="state.activeTab='${tab.id}'; render();" class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium transition cursor-pointer ${state.activeTab === tab.id ? 'bg-red-600 text-white font-semibold shadow-md shadow-red-600/20' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}">
                                <div class="flex items-center space-x-3">
                                    <i class="fa-solid ${tab.icon} w-5 text-center"></i>
                                    <span>${tab.label}</span>
                                </div>
                                ${tab.id === 'users' && pendingCount > 0 ? `<span class="bg-amber-500 text-slate-950 text-[10px] font-bold px-1.5 py-0.5 rounded-full">${pendingCount}</span>` : ''}
                            </button>
                        `).join('')}
                    </div>
                </aside>
            `;
        }

        // --- VIEWS ---
        function renderDashboardView() {
            const approvedUsers = state.users.filter(u => u.status === 'Aktif');
            const totalFees = state.fees.reduce((sum, f) => sum + (f.amount || 0), 0);
            const pendingUsers = state.users.filter(u => u.status === 'Onay Bekliyor');

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between">
                            <div><p class="text-xs text-slate-400">Toplam Onaylı Üye</p><h3 class="text-2xl font-bold text-slate-100 mt-1">${approvedUsers.length}</h3><p class="text-[11px] text-emerald-400 mt-1">Aktif Telsiz Operatörleri</p></div>
                            <div class="w-12 h-12 bg-blue-950/60 border border-blue-800 text-blue-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-users"></i></div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between">
                            <div><p class="text-xs text-slate-400">Toplam Aidat Tahsilatı</p><h3 class="text-2xl font-bold text-slate-100 mt-1">₺${totalFees.toLocaleString()}</h3><p class="text-[11px] text-slate-400 mt-1">2026 Sezonu</p></div>
                            <div class="w-12 h-12 bg-emerald-950/60 border border-emerald-800 text-emerald-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-turkish-lira-sign"></i></div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between">
                            <div><p class="text-xs text-slate-400">Aktif Saha Faaliyetleri</p><h3 class="text-2xl font-bold text-slate-100 mt-1">${state.activities.length}</h3><p class="text-[11px] text-amber-400 mt-1">Tatbikat & Röle Bakımı</p></div>
                            <div class="w-12 h-12 bg-amber-950/60 border border-amber-800 text-amber-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-person-hiking"></i></div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between">
                            <div><p class="text-xs text-slate-400">Onay Bekleyen Üye</p><h3 class="text-2xl font-bold text-slate-100 mt-1">${pendingUsers.length}</h3><p class="text-[11px] text-slate-400 mt-1">Başkan Onayı Bekleniyor</p></div>
                            <div class="w-12 h-12 bg-purple-950/60 border border-purple-800 text-purple-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-user-clock"></i></div>
                        </div>
                    </div>

                    ${pendingUsers.length > 0 ? `
                        <div class="bg-amber-950/40 border border-amber-800/80 p-4 rounded-xl flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-user-shield text-amber-400 text-xl"></i>
                                <div><h4 class="font-bold text-slate-200 text-sm">Onay Bekleyen ${pendingUsers.length} Üyelik Başvurusu Var</h4><p class="text-xs text-slate-400">Yönetim yetkinizle üyeleri inceleyip onaylayabilirsiniz.</p></div>
                            </div>
                            <button onclick="state.activeTab='users'; render();" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold rounded-lg transition cursor-pointer">Üye Listesine Git</button>
                        </div>
                    ` : ''}

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                            <h4 class="font-bold text-slate-200 text-sm mb-4">Üye Kan Grubu Dağılımı</h4>
                            <div class="h-64 flex items-center justify-center"><canvas id="chartBloodGroup"></canvas></div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
                            <h4 class="font-bold text-slate-200 text-sm mb-4">Aylık Aidat Tahsilat Trendi</h4>
                            <div class="h-64 flex items-center justify-center"><canvas id="chartFeeTrend"></canvas></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderUsersView() {
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-bold text-slate-100">Dernek Üye Yönetimi</h2>
                            <p class="text-xs text-slate-400">Üye kayıtları, Telsiz Çağrı Kodları ve Yetki Rolleri</p>
                        </div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-slate-300">
                                <thead class="bg-slate-950 text-slate-400 uppercase text-[10px]">
                                    <tr><th class="px-4 py-3">Ad Soyad</th><th class="px-4 py-3">Callsign</th><th class="px-4 py-3">Kan Grubu</th><th class="px-4 py-3">E-posta</th><th class="px-4 py-3">Rol</th><th class="px-4 py-3">Durum</th><th class="px-4 py-3 text-right">İşlem</th></tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800">
                                    ${state.users.map(u => `
                                        <tr class="hover:bg-slate-800/50">
                                            <td class="px-4 py-3 font-semibold text-slate-100">${u.full_name}</td>
                                            <td class="px-4 py-3 text-red-400 font-mono font-bold">${u.callsign || '-'}</td>
                                            <td class="px-4 py-3 text-red-400 font-bold">${u.blood || '0 Rh+'}</td>
                                            <td class="px-4 py-3 text-slate-400">${u.email}</td>
                                            <td class="px-4 py-3 text-amber-400">${u.role}</td>
                                            <td class="px-4 py-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${u.status === 'Aktif' ? 'bg-emerald-950 text-emerald-400' : 'bg-amber-950 text-amber-400'}">${u.status}</span></td>
                                            <td class="px-4 py-3 text-right space-x-2">
                                                ${u.status === 'Onay Bekliyor' ? `<button onclick="approveMember('${u.id}')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded cursor-pointer">Onayla</button>` : ''}
                                                <button onclick="deleteMember('${u.id}')" class="text-slate-500 hover:text-red-400 p-1 cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFeesView() {
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-bold text-slate-100">Aidat & Finans Takibi</h2>
                            <p class="text-xs text-slate-400">Üye aidat ödemeleri ve makbuz kayıtları</p>
                        </div>
                        <button onclick="openAddDueModal()" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-lg cursor-pointer">+ Aidat Kaydı Ekle</button>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
                        <table class="w-full text-left text-xs text-slate-300">
                            <thead class="bg-slate-950 text-slate-400 uppercase text-[10px]">
                                <tr><th class="px-4 py-3">Üye Adı</th><th class="px-4 py-3">Tutar</th><th class="px-4 py-3">Sezon</th><th class="px-4 py-3 text-right">İşlem</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                ${state.fees.map(f => `
                                    <tr class="hover:bg-slate-800/50">
                                        <td class="px-4 py-3 font-semibold text-slate-100">${f.memberName}</td>
                                        <td class="px-4 py-3 text-emerald-400 font-bold">₺${f.amount}</td>
                                        <td class="px-4 py-3 text-slate-400">${f.date}</td>
                                        <td class="px-4 py-3 text-right"><button onclick="deleteDue('${f.id}')" class="text-slate-500 hover:text-red-400 p-1 cursor-pointer"><i class="fa-solid fa-trash-can"></i></button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderRadioView() {
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-bold text-slate-100">Afet & Telsiz Sahası Durumu</h2>
                            <p class="text-xs text-slate-400">Röle istasyonları ve aktif frekanslar</p>
                        </div>
                        <button onclick="openAddRepeaterModal()" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-lg cursor-pointer">+ Röle Ekle</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        ${state.repeaters.map(r => `
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl relative">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="font-bold text-red-400 font-mono text-sm">${r.name}</span>
                                    <span class="px-2 py-0.5 bg-emerald-950 text-emerald-400 border border-emerald-800 text-[10px] font-bold rounded">ONLINE</span>
                                </div>
                                <div class="text-xs text-slate-300">Frekans: ${r.frequency}</div>
                                <div class="text-xs text-slate-400">Konum: ${r.location || '-'}</div>
                                <button onclick="deleteRepeater('${r.id}')" class="absolute top-3 right-3 text-slate-500 hover:text-red-400 text-xs cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderReportsView() {
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div><h2 class="text-lg font-bold text-slate-100">📊 Dernek Raporları & Analitik</h2><p class="text-xs text-slate-400">Operasyonel raporlar ve belgeler</p></div>
                        <button onclick="openAddReportModal()" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-lg cursor-pointer">+ Rapor Ekle</button>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
                        <table class="w-full text-left text-xs text-slate-300">
                            <thead class="bg-slate-950 text-slate-400 uppercase text-[10px]"><tr><th class="px-4 py-3">Rapor Başlığı</th><th class="px-4 py-3">Kategori</th><th class="px-4 py-3 text-right">İşlem</th></tr></thead>
                            <tbody class="divide-y divide-slate-800">
                                ${state.reports.map(rep => `
                                    <tr class="hover:bg-slate-800/50">
                                        <td class="px-4 py-3 font-semibold text-slate-100">${rep.title}</td>
                                        <td class="px-4 py-3 text-slate-400">${rep.category}</td>
                                        <td class="px-4 py-3 text-right"><button onclick="deleteReport('${rep.id}')" class="text-slate-500 hover:text-red-400 p-1 cursor-pointer"><i class="fa-solid fa-trash-can"></i></button></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderActivitiesView() {
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div><h2 class="text-lg font-bold text-slate-100">📡 Saha Faaliyetleri & Tatbikatlar</h2><p class="text-xs text-slate-400">Arama-kurtarma tatbikatları ve saha görevleri</p></div>
                        <button onclick="openAddActivityModal()" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-lg cursor-pointer">+ Faaliyet Ekle</button>
                    </div>
                    <div class="space-y-3">
                        ${state.activities.map(a => `
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                                <div><h4 class="font-bold text-slate-100 text-sm">${a.title}</h4><p class="text-xs text-slate-400 mt-1">${a.description || ''} • <span class="text-red-400">${a.location || ''}</span></p></div>
                                <button onclick="deleteActivity('${a.id}')" class="text-slate-500 hover:text-red-400 p-1 cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAnnouncementsView() {
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <div><h2 class="text-lg font-bold text-slate-100">📢 Duyurular & Bilgilendirmeler</h2><p class="text-xs text-slate-400">Üyelere anlık bildirim yayını</p></div>
                        <button onclick="openAddAnnouncementModal()" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-lg cursor-pointer">+ Duyuru Ekle</button>
                    </div>
                    <div class="space-y-3">
                        ${state.announcements.map(ann => `
                            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl space-y-2 relative">
                                <h4 class="font-bold text-slate-100 text-base">${ann.title}</h4>
                                <p class="text-xs text-slate-300">${ann.content}</p>
                                <button onclick="deleteAnnouncement('${ann.id}')" class="absolute top-4 right-4 text-slate-500 hover:text-red-400 text-xs cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderMobileSimulatorView() {
            return `
                <div class="space-y-6">
                    <h2 class="text-lg font-bold text-slate-100">📱 Mobil Uygulama & API Entegrasyonu</h2>
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl space-y-4">
                        <label class="block text-xs text-slate-400">Mobil Endpoint URL</label>
                        <input type="text" readonly value="https://api.atak.org.tr/v1/mobile-sync" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-emerald-400">
                    </div>
                </div>
            `;
        }

        // --- MODALS ---
        function openModal(title, html) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('universal-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('universal-modal').classList.add('hidden'); }

        async function openAddDueModal() {
            const { data: members } = await supabaseClient.from('members').select('id, full_name');
            const opts = members ? members.map(m => `<option value="${m.id}">${m.full_name}</option>`).join('') : '';
            openModal("Yeni Aidat Kaydı Ekle", `
                <form onsubmit="handleAddDue(event)" class="space-y-3">
                    <select id="due-member" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100">${opts}</select>
                    <input type="number" id="due-amount" required value="500" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100" placeholder="Tutar">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-xs font-bold cursor-pointer">Kaydet</button>
                </form>
            `);
        }
        async function handleAddDue(e) {
            e.preventDefault();
            const member_id = document.getElementById('due-member').value;
            const amount = parseFloat(document.getElementById('due-amount').value);
            await supabaseClient.from('dues').insert([{ member_id, amount, status: 'Ödendi' }]);
            closeModal(); await fetchAllData(); render();
        }

        function openAddRepeaterModal() {
            openModal("Röle Ekle", `
                <form onsubmit="handleAddRepeater(event)" class="space-y-3">
                    <input type="text" id="rpt-name" required placeholder="Röle Adı" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100">
                    <input type="text" id="rpt-freq" required placeholder="Frekans" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100">
                    <input type="text" id="rpt-loc" placeholder="Konum" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100">
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white py-2 rounded-lg text-xs font-bold cursor-pointer">Kaydet</button>
                </form>
            `);
        }
        async function handleAddRepeater(e) {
            e.preventDefault();
            await supabaseClient.from('repeaters').insert([{ name: document.getElementById('rpt-name').value, frequency: document.getElementById('rpt-freq').value, location: document.getElementById('rpt-loc').value }]);
            closeModal(); await fetchAllData(); render();
        }

        function openAddReportModal() {
            openModal("Röle / Rapor Ekle", `
                <form onsubmit="handleAddReport(event)" class="space-y-3">
                    <input type="text" id="rep-title" required placeholder="Röle Adı / Başlık" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100">
                    <input type="text" id="rep-cat" required placeholder="Kategori" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100">
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white py-2 rounded-lg text-xs font-bold cursor-pointer">Kaydet</button>
                </form>
            `);
        }
        async function handleAddReport(e) {
            e.preventDefault();
            await supabaseClient.from('reports').insert([{ title: document.getElementById('rep-title').value, category: document.getElementById('rep-cat').value }]);
            closeModal(); await fetchAllData(); render();
        }

        function openAddActivityModal() {
            openModal("Saha Faaliyeti Ekle", `
                <form onsubmit="handleAddActivity(event)" class="space-y-3">
                    <input type="text" id="act-title" required placeholder="Başlık" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100">
                    <input type="text" id="act-loc" required placeholder="Konum" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100">
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 py-2 rounded-lg text-xs font-bold cursor-pointer">Kaydet</button>
                </form>
            `);
        }
        async function handleAddActivity(e) {
            e.preventDefault();
            await supabaseClient.from('field_activities').insert([{ title: document.getElementById('act-title').value, location: document.getElementById('act-loc').value }]);
            closeModal(); await fetchAllData(); render();
        }

        function openAddAnnouncementModal() {
            openModal("Duyuru Ekle", `
                <form onsubmit="handleAddAnnouncement(event)" class="space-y-3">
                    <input type="text" id="ann-title" required placeholder="Başlık" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100">
                    <textarea id="ann-content" required placeholder="İçerik" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100"></textarea>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white py-2 rounded-lg text-xs font-bold cursor-pointer">Yayınla</button>
                </form>
            `);
        }
        async function handleAddAnnouncement(e) {
            e.preventDefault();
            await supabaseClient.from('announcements').insert([{ title: document.getElementById('ann-title').value, content: document.getElementById('ann-content').value }]);
            closeModal(); await fetchAllData(); render();
        }

        // --- DELETIONS & APPROVALS ---
        window.approveMember = async (id) => { await supabaseClient.from('members').update({ status: 'Aktif' }).eq('id', id); await fetchAllData(); render(); };
        window.deleteMember = async (id) => { if(confirm("Silmek istediğinize emin misiniz?")) { await supabaseClient.from('members').delete().eq('id', id); await fetchAllData(); render(); } };
        window.deleteDue = async (id) => { await supabaseClient.from('dues').delete().eq('id', id); await fetchAllData(); render(); };
        window.deleteRepeater = async (id) => { await supabaseClient.from('repeaters').delete().eq('id', id); await fetchAllData(); render(); };
        window.deleteReport = async (id) => { await supabaseClient.from('reports').delete().eq('id', id); await fetchAllData(); render(); };
        window.deleteActivity = async (id) => { await supabaseClient.from('field_activities').delete().eq('id', id); await fetchAllData(); render(); };
        window.deleteAnnouncement = async (id) => { await supabaseClient.from('announcements').delete().eq('id', id); await fetchAllData(); render(); };

        // --- RENDER ROUTER ---
        function render() {
            const root = document.getElementById('app');
            if (!state.currentUser) {
                root.innerHTML = renderAuthScreen() + renderNotification();
                return;
            }

            let content = '';
            switch(state.activeTab) {
                case 'dashboard': content = renderDashboardView(); break;
                case 'users': content = renderUsersView(); break;
                case 'fees': content = renderFeesView(); break;
                case 'radio': content = renderRadioView(); break;
                case 'reports': content = renderReportsView(); break;
                case 'activities': content = renderActivitiesView(); break;
                case 'announcements': content = renderAnnouncementsView(); break;
                case 'mobile': content = renderMobileSimulatorView(); break;
                default: content = renderDashboardView();
            }

            root.innerHTML = `
                ${renderHeader()}
                <div class="flex-1 flex flex-col md:flex-row">
                    ${renderSidebar()}
                    <main class="flex-1 p-6 overflow-y-auto">${content}</main>
                </div>
                ${renderNotification()}
                <div id="universal-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-lg shadow-2xl relative">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                            <h3 id="modal-title" class="font-bold text-lg text-red-500">Form</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div id="modal-body"></div>
                    </div>
                </div>
            `;

            setTimeout(initCharts, 50);
        }

        function initCharts() {
            if (state.activeTab === 'dashboard') {
                const ctxBlood = document.getElementById('chartBloodGroup');
                if (ctxBlood) {
                    const counts = {};
                    state.users.forEach(u => { const b = u.blood || '0 Rh+'; counts[b] = (counts[b] || 0) + 1; });
                    new Chart(ctxBlood, {
                        type: 'doughnut',
                        data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: ['#DC2626', '#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#6366F1'] }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94A3B8' } } } }
                    });
                }
                const ctxFee = document.getElementById('chartFeeTrend');
                if (ctxFee) {
                    new Chart(ctxFee, {
                        type: 'bar',
                        data: { labels: ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran'], datasets: [{ label: 'Tahsilat (₺)', data: [1500, 2000, 1800, 2500, 3100, 2800], backgroundColor: '#10B981' }] },
                        options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#94A3B8' } }, y: { ticks: { color: '#94A3B8' } } }, plugins: { legend: { labels: { color: '#94A3B8' } } } }
                    });
                }
            }
        }

        window.onload = checkSession;
    </script>
</body>
</html>
