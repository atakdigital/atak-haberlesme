<body class="antialiased min-h-screen flex flex-col">

    <!-- APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <!-- SCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = "https://iywgxfemglgixjplenyw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FNlMWgu7kmECpYbDLkC3BA_9emOSPy4";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ATAK_LOGO_SVG = `
            <svg viewBox="0 0 200 200" class="w-full h-full rounded-full bg-black border-2 border-red-600 shadow-md">
                <circle cx="100" cy="100" r="92" fill="none" stroke="#D1D5DB" stroke-width="8"/>
                <circle cx="100" cy="100" r="86" fill="#000000"/>
                <path id="curve-top" d="M 35,100 A 65,65 0 1,1 165,100" fill="none"/>
                <text fill="#DC2626" font-size="13" font-weight="bold" font-family="Arial">
                    <textPath href="#curve-top" startOffset="50%" text-anchor="middle">ACİL AFET HABERLEŞME</textPath>
                </text>
                <text x="100" y="112" fill="#DC2626" font-size="34" font-weight="900" font-family="Arial" text-anchor="middle" letter-spacing="2">ATAK</text>
                <g transform="translate(85, 122) scale(0.65)" stroke="#FFFFFF" stroke-width="3" fill="none">
                    <path d="M20 40 L20 70 L30 70 L30 40 Z" fill="#FFFFFF"/>
                    <circle cx="25" cy="28" r="8" fill="#FFFFFF"/>
                    <path d="M5 15 Q25 -5 45 15"/>
                    <path d="M10 22 Q25 8 40 22"/>
                    <path d="M15 29 Q25 18 35 29"/>
                </g>
                <path id="curve-bot" d="M 35,105 A 65,65 0 1,0 165,105" fill="none"/>
                <text fill="#DC2626" font-size="13" font-weight="bold" font-family="Arial">
                    <textPath href="#curve-bot" startOffset="50%" text-anchor="middle">ARAMA KURTARMA</textPath>
                </text>
            </svg>
        `;

        let state = {
            currentUser: null,
            users: [],
            fees: [],
            expenses: [],
            announcements: [],
            activities: [],
            repeaters: [],
            reports: [],
            chatMessages: [],
            contactInfo: {
                center: 'İzmir, Türkiye',
                emergency_channel: '439.2625 MHz',
                field_freq: '433.475 MHz',
                email: 'iletisim@atakhaberlesme.org'
            },
            disasterMode: false,
            userAcknowledgedDisaster: false,
            activeTab: 'dashboard',
            notification: null,
            expandedFeeMemberId: null
        };

        let alarmInterval = null;
        let globalAudioCtx = null;
        let realtimeChannel = null;
        let bloodChartInstance = null;
        let feeChartInstance = null;

        // YÖNETİM VE BAŞKAN YARDIMCISI YETKİ KONTROLÜ
        function checkIsYonetim(roleStr) {
            const role = roleStr || (state.currentUser ? state.currentUser.role : '');
            if (!role) return false;
            const r = role.toString().trim()
                .replace(/İ/g, 'i').replace(/I/g, 'ı')
                .replace(/Ğ/g, 'g').replace(/Ü/g, 'u')
                .replace(/Ş/g, 's').replace(/Ö/g, 'o')
                .replace(/Ç/g, 'c').toLowerCase();

            if (r === 'normal üye' || r === 'normal uye' || r === 'uye' || r === 'üye' || r === 'normal') {
                return false;
            }

            const managementKeywords = ['baskan', 'yardimcisi', 'sekreter', 'sayman', 'yonetim', 'admin', 'kurul'];
            return managementKeywords.some(key => r.includes(key));
        }

        function checkIsBaskanOrYardimci(roleStr) {
            const role = roleStr || (state.currentUser ? state.currentUser.role : '');
            if (!role) return false;
            const r = role.toString().trim()
                .replace(/İ/g, 'i').replace(/I/g, 'ı')
                .replace(/Ğ/g, 'g').replace(/Ü/g, 'u')
                .replace(/Ş/g, 's').replace(/Ö/g, 'o')
                .replace(/Ç/g, 'c').toLowerCase();

            return r.includes('baskan') || r.includes('başkan');
        }

        function showNotification(msg, type = 'success') {
            state.notification = { msg, type };
            render();
            setTimeout(() => { state.notification = null; render(); }, 3500);
        }

        async function playSingleAlarmBeep() {
            try {
                if (!globalAudioCtx) {
                    globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (globalAudioCtx.state === 'suspended') {
                    await globalAudioCtx.resume();
                }

                const oscillator = globalAudioCtx.createOscillator();
                const gainNode = globalAudioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, globalAudioCtx.currentTime);
                oscillator.frequency.setValueAtTime(440, globalAudioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, globalAudioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(globalAudioCtx.destination);

                oscillator.start();
                oscillator.stop(globalAudioCtx.currentTime + 0.8);
            } catch (e) {
                console.log("Ses çalma kısıtlaması:", e);
            }
        }

        function startRepeatingAlarm() {
            stopRepeatingAlarm();
            if (!state.userAcknowledgedDisaster) {
                playSingleAlarmBeep();
                alarmInterval = setInterval(() => {
                    if (state.disasterMode && !state.userAcknowledgedDisaster) {
                        playSingleAlarmBeep();
                    } else {
                        stopRepeatingAlarm();
                    }
                }, 2500);
            }
        }

        function stopRepeatingAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        // KESİNTİSİZ OTURUM VE BİREBİR ÜYE ROLÜ YÜKLEME
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: member } = await supabaseClient.from('members').select('*').eq('id', session.user.id).maybeSingle();
                if (member) {
                    state.currentUser = member;
                } else {
                    const { data: memberByEmail } = await supabaseClient.from('members').select('*').ilike('email', session.user.email).maybeSingle();
                    if (memberByEmail) {
                        state.currentUser = memberByEmail;
                    } else {
                        state.currentUser = { id: session.user.id, email: session.user.email, full_name: session.user.email, role: 'Başkan Yardımcısı', callsign: 'TA1XXX' };
                    }
                }
            } else {
                state.currentUser = null;
            }
            await fetchAllData();

            if (state.currentUser) {
                const matchedUser = state.users.find(u => u.id === state.currentUser.id || (u.email && u.email.toLowerCase() === state.currentUser.email.toLowerCase()));
                if (matchedUser) {
                    state.currentUser = matchedUser;
                }
            }

            initRealtimeListener();
            render();
        }

        async function fetchAllData() {
            try {
                const [mRes, dRes, expRes, aRes, rRes, repRes, repPortRes, chatRes, sysRes, contactRes] = await Promise.all([
                    supabaseClient.from('members').select('*'),
                    supabaseClient.from('dues').select('*, members(full_name)'),
                    supabaseClient.from('expenses').select('*'),
                    supabaseClient.from('announcements').select('*'),
                    supabaseClient.from('field_activities').select('*'),
                    supabaseClient.from('repeaters').select('*'),
                    supabaseClient.from('reports').select('*'),
                    supabaseClient.from('chat_messages').select('*').order('created_at', { ascending: true }),
                    supabaseClient.from('system_settings').select('*').eq('key', 'disaster_mode').maybeSingle(),
                    supabaseClient.from('system_settings').select('*').eq('key', 'contact_info').maybeSingle()
                ]);

                if (mRes.data) state.users = mRes.data;
                if (dRes.data) state.fees = dRes.data.map(d => ({
                    id: d.id,
                    member_id: d.member_id,
                    memberName: d.members?.full_name || 'Üye',
                    amount: d.amount,
                    month: d.month || 'Ocak',
                    year: d.year || 2026,
                    status: d.status || 'Ödendi'
                }));
                if (expRes.data) state.expenses = expRes.data;
                if (aRes.data) state.announcements = aRes.data;
                if (rRes.data) state.activities = rRes.data;
                if (repRes.data) state.repeaters = repRes.data;
                if (repPortRes.data) state.reports = repPortRes.data;
                if (chatRes.data) state.chatMessages = chatRes.data;
                if (contactRes.data && contactRes.data.value) {
                    try {
                        state.contactInfo = JSON.parse(contactRes.data.value);
                    } catch(e) {}
                }
                
                const prevDisasterState = state.disasterMode;
                if (sysRes.data) state.disasterMode = sysRes.data.value === 'true';

                if (!prevDisasterState && state.disasterMode) {
                    state.userAcknowledgedDisaster = false;
                    startRepeatingAlarm();
                } else if (!state.disasterMode) {
                    stopRepeatingAlarm();
                    state.userAcknowledgedDisaster = false;
                }
            } catch (err) {
                console.error("Veri çekme hatası:", err);
            }
        }

        function initRealtimeListener() {
            if (realtimeChannel) {
                supabaseClient.removeChannel(realtimeChannel);
            }

            realtimeChannel = supabaseClient.channel('global-live-channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages' }, async (payload) => {
                    if (payload.eventType === 'INSERT') {
                        state.chatMessages.push(payload.new);
                        render();
                        const container = document.getElementById('chat-messages-container');
                        if (container) container.scrollTop = container.scrollHeight;
                    } else {
                        const { data } = await supabaseClient.from('chat_messages').select('*').order('created_at', { ascending: true });
                        if (data) state.chatMessages = data;
                        render();
                    }
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'system_settings' }, async (payload) => {
                    if (payload.new && payload.new.key === 'disaster_mode') {
                        const newStatus = payload.new.value === 'true';
                        if (!state.disasterMode && newStatus) {
                            state.userAcknowledgedDisaster = false;
                            startRepeatingAlarm();
                        } else if (!newStatus) {
                            stopRepeatingAlarm();
                            state.userAcknowledgedDisaster = false;
                        }
                        state.disasterMode = newStatus;
                    }
                    if (payload.new && payload.new.key === 'contact_info') {
                        try { state.contactInfo = JSON.parse(payload.new.value); } catch(e){}
                    }
                    render();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, async () => { 
                    await fetchAllData(); 
                    if (state.currentUser) {
                        const refreshed = state.users.find(u => u.id === state.currentUser.id || (u.email && u.email.toLowerCase() === state.currentUser.email.toLowerCase()));
                        if (refreshed) state.currentUser = refreshed;
                    }
                    render(); 
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'dues' }, async () => { await fetchAllData(); render(); })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, async () => { await fetchAllData(); render(); })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'repeaters' }, async () => { await fetchAllData(); render(); })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'reports' }, async () => { await fetchAllData(); render(); })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'field_activities' }, async () => { await fetchAllData(); render(); })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, async () => { await fetchAllData(); render(); })
                .subscribe();
        }

        async function toggleDisasterMode() {
            const newStatus = !state.disasterMode;
            await supabaseClient.from('system_settings').upsert({ key: 'disaster_mode', value: newStatus ? 'true' : 'false' });
            
            state.disasterMode = newStatus;
            if (state.disasterMode) {
                state.userAcknowledgedDisaster = false;
                startRepeatingAlarm();
                showNotification('🚨 Kırmızı Alarm! Tüm kullanıcılara afet sinyali gönderildi.', 'danger');
            } else {
                stopRepeatingAlarm();
                state.userAcknowledgedDisaster = false;
                showNotification('Afet modu tamamen kapatıldı.', 'info');
            }
            render();
        }

        window.acknowledgeDisaster = function() {
            state.userAcknowledgedDisaster = true;
            stopRepeatingAlarm();
            render();
        };

        async function handleLogin(e) {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                showNotification("Giriş Hatası: " + error.message, 'danger');
            } else { 
                await checkSession();
                state.activeTab = 'dashboard';
                render();
                showNotification("Başarıyla giriş yapıldı."); 
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const form = e.target;
            const email = form.email.value;
            const password = form.password.value;
            const name = form.name.value;
            const callsign = form.callsign.value.toUpperCase();
            const phone = form.phone.value;
            const blood = form.blood.value;

            const { data, error } = await supabaseClient.auth.signUp({
                email, password,
                options: { data: { full_name: name, callsign, phone, blood } }
            });

            if (error) showNotification("Kayıt Hatası: " + error.message, 'danger');
            else {
                if (data.user) {
                    await supabaseClient.from('members').insert([{
                        id: data.user.id, email, full_name: name, callsign, phone, blood, role: 'Normal Üye', status: 'Onay Bekliyor'
                    }]);
                }
                showNotification('Kayıt başvurunuz alındı. Yönetici onayı bekleniyor.', 'warning');
                form.reset();
            }
        }

        async function handleLogout() {
            stopRepeatingAlarm();
            await supabaseClient.auth.signOut();
            state.currentUser = null;
            render();
        }

        function renderNotification() {
            if (!state.notification) return '';
            const bg = state.notification.type === 'danger' ? 'bg-red-600' : state.notification.type === 'warning' ? 'bg-amber-600' : 'bg-emerald-600';
            return `
                <div class="fixed top-5 right-5 z-50 ${bg} text-white px-5 py-3 rounded-lg shadow-2xl flex items-center space-x-3">
                    <i class="fa-solid ${state.notification.type === 'danger' ? 'fa-triangle-exclamation' : 'fa-circle-check'} text-xl"></i>
                    <span class="font-medium text-sm">${state.notification.msg}</span>
                </div>
            `;
        }

        function renderGlobalDisasterModal() {
            if (!state.disasterMode || !state.currentUser) return '';
            if (state.userAcknowledgedDisaster) return '';

            const isY = checkIsYonetim(state.currentUser?.role);

            return `
                <div class="fixed inset-0 bg-red-950/90 z-50 flex items-center justify-center p-6 backdrop-blur-md disaster-pulse">
                    <div class="bg-slate-950 border-4 border-red-600 rounded-3xl p-8 max-w-xl w-full text-center space-y-6 shadow-2xl shadow-red-600/50">
                        <div class="w-24 h-24 bg-red-600 text-white rounded-full flex items-center justify-center mx-auto text-4xl animate-bounce shadow-lg shadow-red-600/60">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="space-y-2">
                            <h1 class="text-3xl font-black text-red-500 tracking-wider">KIRMIZI ALARM!</h1>
                            <p class="text-lg font-bold text-slate-100">ACİL AFET HABERLEŞME DURUMU TETİKLENDİ</p>
                            <p class="text-xs text-slate-400 leading-relaxed">Dernek yönetimi tarafından olağanüstü afet durumu ilan edilmiştir. Lütfen telsizlerinizi ilgili acil durum frekanslarına ayarlayın ve operasyon talimatlarını bekleyin.</p>
                        </div>
                        <div class="p-4 bg-red-950/60 border border-red-800 rounded-xl text-red-300 text-xs font-mono font-bold">
                            AKTİF ÇAĞRI KANALI: ${state.contactInfo.emergency_channel} / SAHA FREKANSI: ${state.contactInfo.field_freq}
                        </div>
                        
                        <button onclick="window.acknowledgeDisaster()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-red-600/50 cursor-pointer flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-check-circle"></i><span>Anladım / Tamam (Sesi Sustur)</span>
                        </button>

                        ${isY ? `
                            <div class="text-[11px] text-amber-400 font-semibold italic">Yönetici Notu: Bu alarmı tüm sistem ve üyeler için tamamen kapatmak istiyorsanız üst menüdeki "AFET MODU AKTİF (KAPAT)" butonuna basabilirsiniz.</div>
                        ` : ''}

                        <div class="text-[11px] text-slate-500 italic">Bu uyarı merkezi sunucudan anlık olarak iletilmiştir.</div>
                    </div>
                </div>
            `;
        }

        function renderAuthScreen() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-red-950">
                    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
                        <div class="p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-800">
                            <div>
                                <div class="flex items-center space-x-3 mb-6">
                                    <div class="w-12 h-12 shrink-0">${ATAK_LOGO_SVG}</div>
                                    <div><h1 class="font-extrabold text-xl tracking-wider text-white">ATAK DERNEĞİ</h1><p class="text-xs text-red-500 font-semibold">ACİL AFET HABERLEŞME</p></div>
                                </div>
                                <h2 class="text-lg font-bold text-slate-200 mb-4">Yönetim Paneli Girişi</h2>
                                <form onsubmit="handleLogin(event)" class="space-y-4">
                                    <div><label class="block text-xs font-medium text-slate-400 mb-1">E-posta</label><input type="email" name="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100"></div>
                                    <div><label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label><input type="password" name="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100"></div>
                                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-sm cursor-pointer">Giriş Yap</button>
                                </form>
                            </div>
                        </div>
                        <div class="p-8 bg-slate-900/50 flex flex-col justify-center">

                            <form onsubmit="handleRegister(event)" class="space-y-2.5 mt-1">
                                <div><label class="block text-xs font-medium text-slate-400 mb-0.5">Ad Soyad</label><input type="text" name="name" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 text-sm text-slate-100"></div>
                                <div><label class="block text-xs font-medium text-slate-400 mb-0.5">Callsign</label><input type="text" name="callsign" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 text-sm text-slate-100"></div>

                                <div><label class="block text-xs font-medium text-slate-400 mb-0.5">Şifre</label><input type="password" name="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 text-sm text-slate-100"></div>
                                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-2 rounded-lg text-sm cursor-pointer mt-1">Kayıt Ol</button>

        function renderHeader() {
            const isY = checkIsYonetim(state.currentUser?.role);
            return `
                <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between sticky top-0 z-40">
                    <div class="flex items-center space-x-4">

                                                const isUnpaidPast = !isPaid && isPastOrCurrentMonth;

                                                let cardBg = 'bg-slate-900 border-slate-800';
                                                let textStatusColor = 'text-slate-500';
                                                let dotColor = 'bg-slate-600';

                                                if (isPaid) {

                                                    textStatusColor = 'text-emerald-300';
                                                    dotColor = 'bg-emerald-500 shadow-md shadow-emerald-500/50';

                                                    dotColor = 'bg-red-500 animate-pulse';

                                                        </div>

        window.toggleFeeAccordion = function(memberId) {
            if (state.expandedFeeMemberId === memberId) {
                state.expandedFeeMemberId = null;
            } else {
                state.expandedFeeMemberId = memberId;
            }
            render();
        };

        window.quickAddFee = async function(memberId, month, year) {
            if (!checkIsYonetim(state.currentUser?.role)) return;
            const amount = prompt("Tahsilat tutarını girin (₺):", "500");
            if (!amount) return;

            const { error } = await supabaseClient.from('dues').insert([{
                member_id: memberId,
                month: month,
                year: year,
                amount: parseFloat(amount),
                status: 'Ödendi'
            }]);

            if (error) {
                showNotification("Aidat ekleme hatası: " + error.message, 'danger');
            } else {
                showNotification(`${month} ayı aidatı başarıyla tahsil edildi.`);
                await fetchAllData();
                render();
            }
        };

        window.deleteFeeRecord = async function(feeId) {
            if (!checkIsYonetim(state.currentUser?.role)) return;
            if (!confirm("Bu aya ait aidat kaydını silmek/iptal etmek istediğinize emin misiniz?")) return;

            const { error } = await supabaseClient.from('dues').delete().eq('id', feeId);
            if (error) {
                showNotification("Silme hatası: " + error.message, 'danger');
            } else {
                showNotification("Aidat kaydı kaldırıldı.", "info");
                await fetchAllData();
                render();
            }
        };

            e.preventDefault();
            if (!checkIsYonetim(state.currentUser?.role)) return;
            await supabaseClient.from('announcements').insert([{ title: document.getElementById('ann-title').value, content: document.getElementById('ann-content').value }]);
            closeModal(); await fetchAllData(); render();
        }

        window.approveMember = async (id) => { if(checkIsYonetim(state.currentUser?.role)) { await supabaseClient.from('members').update({ status: 'Aktif' }).eq('id', id); await fetchAllData(); render(); } };
        window.deleteMember = async (id) => { 
            if(!checkIsYonetim(state.currentUser?.role)) return;
            const { error } = await supabaseClient.from('members').delete().eq('id', id);
            if (error) {
                showNotification("Silme Hatası: " + error.message, "danger");
            } else {
                await fetchAllData(); 
                render(); 
                showNotification("Üye sistemden silindi.", "info");
            }
        };
        window.deleteExpense = async (id) => { if(checkIsYonetim(state.currentUser?.role)) { await supabaseClient.from('expenses').delete().eq('id', id); await fetchAllData(); render(); showNotification("Gider silindi.", "info"); } };
        window.deleteRepeater = async (id) => { if(checkIsYonetim(state.currentUser?.role)) { await supabaseClient.from('repeaters').delete().eq('id', id); await fetchAllData(); render(); } };
        window.deleteReport = async (id) => { if(checkIsYonetim(state.currentUser?.role)) { await supabaseClient.from('reports').delete().eq('id', id); await fetchAllData(); render(); } };
        window.deleteActivity = async (id) => { 
            if(checkIsYonetim(state.currentUser?.role)) { 
                const { error } = await supabaseClient.from('field_activities').delete().eq('id', id); 
                if(error) {
                    showNotification("Silme Hatası: " + error.message, "danger");
                } else {
                    await fetchAllData(); 
                    render(); 
                    showNotification("Faaliyet silindi.", "info");
                }
            } 
        };
        window.deleteAnnouncement = async (id) => { if(checkIsYonetim(state.currentUser?.role)) { await supabaseClient.from('announcements').delete().eq('id', id); await fetchAllData(); render(); } };

        function render() {
            const root = document.getElementById('app');
            if (!state.currentUser) { 
                root.innerHTML = renderAuthScreen() + renderNotification() + renderGlobalDisasterModal(); 
                return; 
            }

            let content = '';
            switch(state.activeTab) {
                case 'dashboard': content = renderDashboardView(); break;
                case 'users': content = renderUsersView(); break;
                case 'fees': content = renderFeesView(); break;
                case 'expenses': content = renderExpensesView(); break;
                case 'radio': content = renderRadioView(); break;
                case 'reports': content = renderReportsView(); break;
                case 'activities': content = renderActivitiesView(); break;
                case 'announcements': content = renderAnnouncementsView(); break;
                case 'contact': content = renderContactView(); break;
                case 'chat': content = renderChatView(); break;
                case 'mobile': 
                    if (checkIsYonetim(state.currentUser?.role)) {
                        content = renderMobileSimulatorView(); 
                    } else {
                        state.activeTab = 'dashboard';
                        content = renderDashboardView();
                    }
                    break;
                default: content = renderDashboardView();
            }

            root.innerHTML = `
                ${renderHeader()}
                <div class="flex-1 flex flex-col md:flex-row">
                    ${renderSidebar()}
                    <main class="flex-1 p-6 overflow-y-auto">${content}</main>
                </div>
                ${renderNotification()}
                ${renderGlobalDisasterModal()}
                <div id="universal-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-lg shadow-2xl relative">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                            <h3 id="modal-title" class="font-bold text-lg text-red-500">Form</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div id="modal-body"></div>
                    </div>
                </div>
            `;
            setTimeout(initCharts, 50);

            if (state.activeTab === 'chat') {
                const container = document.getElementById('chat-messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            }
        }

        // CHART.JS ÖNBELLEK VE ÇAKIŞMA ÖNLEME KONTROLÜ
        function initCharts() {
            if (state.activeTab === 'dashboard') {
                const ctxBlood = document.getElementById('chartBloodGroup');
                if (ctxBlood) {
                    if (bloodChartInstance) {
                        bloodChartInstance.destroy();
                        bloodChartInstance = null;
                    }
                    const counts = {};
                    state.users.forEach(u => { const b = u.blood || '0 Rh+'; counts[b] = (counts[b] || 0) + 1; });
                    bloodChartInstance = new Chart(ctxBlood, { 
                        type: 'doughnut', 
                        data: { 
                            labels: Object.keys(counts), 
                            datasets: [{ data: Object.values(counts), backgroundColor: ['#DC2626', '#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#6366F1'] }] 
                        }, 
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94A3B8' } } } } 
                    });
                }

                const ctxFee = document.getElementById('chartFeeTrend');
                if (ctxFee && checkIsYonetim(state.currentUser?.role)) {
                    if (feeChartInstance) {
                        feeChartInstance.destroy();
                        feeChartInstance = null;
                    }
                    const monthsOrder = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
                    const monthTotals = {};
                    monthsOrder.forEach(m => monthTotals[m] = 0);
                    state.fees.forEach(f => {
                        if (f.month && monthTotals.hasOwnProperty(f.month)) {
                            monthTotals[f.month] += (f.amount || 0);
                        }
                    });

                    feeChartInstance = new Chart(ctxFee, { 
                        type: 'bar', 
                        data: { 
                            labels: monthsOrder, 
                            datasets: [{ label: 'Tahsilat (₺)', data: monthsOrder.map(m => monthTotals[m]), backgroundColor: '#10B981' }] 
                        }, 
                        options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#94A3B8' } }, y: { ticks: { color: '#94A3B8' } } }, plugins: { legend: { labels: { color: '#94A3B8' } } } } 
                    });
                }
            }
        }

        window.onload = checkSession;
    </script>
</body>
</html>
