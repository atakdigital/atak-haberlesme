<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAK Acil Afet Haberleşme Derneği - Yönetim Paneli</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        atak: {
                            red: '#DC2626',
                            redDark: '#991B1B',
                            darkBg: '#0F172A',
                            cardBg: '#1E293B',
                            border: '#334155',
                            gold: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0F19; color: #F8FAFC; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .disaster-pulse { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <!-- SCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = "https://iywgxfemglgixjplenyw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FNlMWgu7kmECpYbDLkC3BA_9emOSPy4";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let state = {
            currentUser: null,
            users: [],
            fees: [],
            announcements: [],
            activities: [],
            repeaters: [],
            reports: [],
            disasterMode: false,
            activeTab: 'dashboard',
            notification: null
        };

        function checkIsYonetim(roleStr) {
            const role = roleStr || (state.currentUser ? state.currentUser.role : '');
            if (!role) return false;
            const r = role.toString().trim()
                .replace(/İ/g, 'i').replace(/I/g, 'ı')
                .replace(/Ğ/g, 'g').replace(/Ü/g, 'u')
                .replace(/Ş/g, 's').replace(/Ö/g, 'o')
                .replace(/Ç/g, 'c').toLowerCase();

            if (r === 'normal üye' || r === 'normal uye' || r === 'uye' || r === 'üye' || r === 'normal') {
                return false;
            }

            const managementKeywords = ['baskan', 'sekreter', 'sayman', 'yonetim', 'admin', 'kurul'];
            return managementKeywords.some(key => r.includes(key));
        }

        function showNotification(msg, type = 'success') {
            state.notification = { msg, type };
            render();
            setTimeout(() => { state.notification = null; render(); }, 3500);
        }

        function playDisasterAlarmSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 1.5);
            } catch (e) {
                console.log("Ses çalınamadı:", e);
            }
        }

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: member } = await supabaseClient.from('members').select('*').eq('id', session.user.id).single();
                if (member) {
                    state.currentUser = member;
                } else {
                    state.currentUser = { id: session.user.id, email: session.user.email, full_name: session.user.email, role: 'Normal Üye', callsign: 'TA1XXX' };
                }
            } else {
                state.currentUser = null;
            }
            await fetchAllData();
            initRealtimeListener();
            render();
        }

        async function fetchAllData() {
            try {
                const [mRes, dRes, aRes, rRes, repRes, repPortRes, sysRes] = await Promise.all([
                    supabaseClient.from('members').select('*'),
                    supabaseClient.from('dues').select('*, members(full_name)'),
                    supabaseClient.from('announcements').select('*'),
                    supabaseClient.from('field_activities').select('*'),
                    supabaseClient.from('repeaters').select('*'),
                    supabaseClient.from('reports').select('*'),
                    supabaseClient.from('system_settings').select('*').eq('key', 'disaster_mode').single()
                ]);

                if (mRes.data) state.users = mRes.data;
                if (dRes.data) state.fees = dRes.data.map(d => ({
                    id: d.id,
                    memberName: d.members?.full_name || 'Üye',
                    amount: d.amount,
                    month: d.month || 'Ocak',
                    year: d.year || 2026,
                    status: d.status || 'Ödendi'
                }));
                if (aRes.data) state.announcements = aRes.data;
                if (rRes.data) state.activities = rRes.data;
                if (repRes.data) state.repeaters = repRes.data;
                if (repPortRes.data) state.reports = repPortRes.data;
                
                const prevDisasterState = state.disasterMode;
                if (sysRes.data) state.disasterMode = sysRes.data.value === 'true';

                if (!prevDisasterState && state.disasterMode) {
                    playDisasterAlarmSound();
                }
            } catch (err) {
                console.error("Veri çekme hatası:", err);
            }
        }

        function initRealtimeListener() {
            const channel = supabaseClient.channel('db-changes');

            ['members', 'dues', 'field_activities', 'announcements', 'system_settings', 'repeaters', 'reports'].forEach(tableName => {
                channel.on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: tableName },
                    async (payload) => {
                        if (tableName === 'system_settings' && payload.new && payload.new.key === 'disaster_mode') {
                            const newStatus = payload.new.value === 'true';
                            if (!state.disasterMode && newStatus) {
                                playDisasterAlarmSound();
                            }
                            state.disasterMode = newStatus;
                        }
                        await fetchAllData();
                        render();
                    }
                );
            });

            channel.subscribe();
        }

        async function toggleDisasterMode() {
            const newStatus = !state.disasterMode;
            await supabaseClient.from('system_settings').upsert({ key: 'disaster_mode', value: newStatus ? 'true' : 'false' });
            
            state.disasterMode = newStatus;
            if (state.disasterMode) {
                playDisasterAlarmSound();
                showNotification('🚨 Kırmızı Alarm! Tüm kullanıcılara afet sinyali gönderildi.', 'danger');
            } else {
                showNotification('Afet modu kapatıldı.', 'info');
            }
            render();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                showNotification("Giriş Hatası: " + error.message, 'danger');
            } else { 
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    const { data: member } = await supabaseClient.from('members').select('*').eq('id', session.user.id).single();
                    state.currentUser = member || { id: session.user.id, email: session.user.email, full_name: session.user.email, role: 'Normal Üye', callsign: 'TA1XXX' };
                }
                await fetchAllData();
                state.activeTab = 'dashboard';
                render();
                showNotification("Başarıyla giriş yapıldı."); 
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const form = e.target;
            const email = form.email.value;
            const password = form.password.value;
            const name = form.name.value;
            const callsign = form.callsign.value.toUpperCase();

            const { data, error } = await supabaseClient.auth.signUp({
                email, password,
                options: { data: { full_name: name, callsign } }
            });

            if (error) showNotification("Kayıt Hatası: " + error.message, 'danger');
            else {
                if (data.user) {
                    await supabaseClient.from('members').insert([{
                        id: data.user.id, email, full_name: name, callsign, role: 'Normal Üye', status: 'Onay Bekliyor'
                    }]);
                }
                showNotification('Kayıt başvurunuz alındı. Yönetici onayı bekleniyor.', 'warning');
                form.reset();
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            state.currentUser = null;
            render();
        }

        function renderNotification() {
            if (!state.notification) return '';
            const bg = state.notification.type === 'danger' ? 'bg-red-600' : state.notification.type === 'warning' ? 'bg-amber-600' : 'bg-emerald-600';
            return `
                <div class="fixed top-5 right-5 z-50 ${bg} text-white px-5 py-3 rounded-lg shadow-2xl flex items-center space-x-3">
                    <i class="fa-solid ${state.notification.type === 'danger' ? 'fa-triangle-exclamation' : 'fa-circle-check'} text-xl"></i>
                    <span class="font-medium text-sm">${state.notification.msg}</span>
                </div>
            `;
        }

        function renderGlobalDisasterModal() {
            if (!state.disasterMode || !state.currentUser) return '';
            const isY = checkIsYonetim(state.currentUser?.role);
            if (isY) return '';

            return `
                <div class="fixed inset-0 bg-red-950/90 z-50 flex items-center justify-center p-6 backdrop-blur-md disaster-pulse">
                    <div class="bg-slate-950 border-4 border-red-600 rounded-3xl p-8 max-w-xl w-full text-center space-y-6 shadow-2xl shadow-red-600/50">
                        <div class="w-24 h-24 bg-red-600 text-white rounded-full flex items-center justify-center mx-auto text-4xl animate-bounce shadow-lg shadow-red-600/60">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="space-y-2">
                            <h1 class="text-3xl font-black text-red-500 tracking-wider">KIRMIZI ALARM!</h1>
                            <p class="text-lg font-bold text-slate-100">ACİL AFET HABERLEŞME DURUMU TETİKLENDİ</p>
                            <p class="text-xs text-slate-400 leading-relaxed">Dernek yönetimi tarafından olağanüstü afet durumu ilan edilmiştir. Lütfen telsizlerinizi ilgili acil durum frekanslarına ayarlayın ve operasyon talimatlarını bekleyin.</p>
                        </div>
                        <div class="p-4 bg-red-950/60 border border-red-800 rounded-xl text-red-300 text-xs font-mono font-bold">
                            AKTİF ÇAĞRI KANALI: 439.2625 MHz / SAHA FREKANSI: 433.475 MHz
                        </div>
                        <div class="text-[11px] text-slate-500 italic">Bu uyarı merkezi sunucudan anlık olarak iletilmiştir.</div>
                    </div>
                </div>
            `;
        }

        function renderAuthScreen() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-red-950">
                    <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
                        <div class="p-8 flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-800">
                            <div>
                                <div class="flex items-center space-x-3 mb-6">
                                    <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-white text-2xl font-black shadow-lg"><i class="fa-solid fa-radio"></i></div>
                                    <div><h1 class="font-extrabold text-xl tracking-wider text-white">ATAK DERNEĞİ</h1><p class="text-xs text-red-500 font-semibold">ACİL AFET HABERLEŞME</p></div>
                                </div>
                                <h2 class="text-lg font-bold text-slate-200 mb-4">Yönetim Paneli Girişi</h2>
                                <form onsubmit="handleLogin(event)" class="space-y-4">
                                    <div><label class="block text-xs font-medium text-slate-400 mb-1">E-posta</label><input type="email" name="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100"></div>
                                    <div><label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label><input type="password" name="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100"></div>
                                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-sm cursor-pointer">Giriş Yap</button>
                                </form>
                            </div>
                        </div>
                        <div class="p-8 bg-slate-900/50">
                            <h2 class="text-lg font-bold text-slate-200 mb-1">Yeni Üye Kaydı</h2>
                            <p class="text-[11px] text-amber-400 mb-3">Kayıt olduktan sonra mail onayı gerekmez, doğrudan yönetici onayı beklenir.</p>
                            <form onsubmit="handleRegister(event)" class="space-y-3 mt-2">
                                <div><label class="block text-xs font-medium text-slate-400 mb-1">Ad Soyad</label><input type="text" name="name" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100"></div>
                                <div><label class="block text-xs font-medium text-slate-400 mb-1">Callsign</label><input type="text" name="callsign" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100"></div>
                                <div><label class="block text-xs font-medium text-slate-400 mb-1">E-posta</label><input type="email" name="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100"></div>
                                <div><label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label><input type="password" name="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100"></div>
                                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-2 rounded-lg text-sm cursor-pointer mt-2">Kayıt Ol</button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHeader() {
            const isY = checkIsYonetim(state.currentUser?.role);
            return `
                <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between sticky top-0 z-40">
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 bg-red-600 rounded-lg flex items-center justify-center text-white font-bold"><i class="fa-solid fa-radio"></i></div>
                            <div><h1 class="font-bold text-slate-100 text-base">ATAK YÖNETİM PANELİ</h1><p class="text-[10px] text-red-500 font-bold uppercase">Acil Afet Haberleşme Derneği</p></div>
                        </div>
                        ${isY ? `
                            <button onclick="toggleDisasterMode()" class="ml-6 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-2 ${state.disasterMode ? 'bg-red-600 text-white disaster-pulse animate-bounce' : 'bg-red-950/40 text-red-400 border border-red-800'} cursor-pointer">
                                <i class="fa-solid fa-triangle-exclamation"></i><span>${state.disasterMode ? 'AFET MODU AKTİF (KAPAT)' : 'AFET MODUNU TETİKLE'}</span>
                            </button>
                        ` : ''}
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="text-right hidden sm:block">
                            <div class="text-sm font-semibold text-slate-200"><span>${state.currentUser.full_name}</span> <span class="bg-red-950 border border-red-800 text-red-400 text-[10px] px-1.5 py-0.5 rounded font-mono">${state.currentUser.callsign || 'TA1XXX'}</span></div>
                            <div class="text-xs text-amber-500">${state.currentUser.role}</div>
                        </div>
                        <button onclick="handleLogout()" class="w-9 h-9 bg-slate-800 hover:bg-red-900/50 border border-slate-700 rounded-lg flex items-center justify-center text-slate-300 cursor-pointer"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                </header>
            `;
        }

        function renderSidebar() {
            const tabs = [
                { id: 'dashboard', label: 'Genel Bakış', icon: 'fa-chart-pie' },
                { id: 'users', label: 'Üye Yönetimi', icon: 'fa-users' },
                { id: 'fees', label: 'Aidat Yönetimi', icon: 'fa-wallet' },
                { id: 'radio', label: 'Afet & Telsiz Sahası', icon: 'fa-tower-cell' },
                { id: 'reports', label: 'Raporlar', icon: 'fa-chart-column' },
                { id: 'activities', label: 'Saha Faaliyetleri', icon: 'fa-person-hiking' },
                { id: 'announcements', label: 'Duyurular', icon: 'fa-bullhorn' },
                { id: 'mobile', label: 'Mobil Uygulama & API', icon: 'fa-mobile-screen-button' }
            ];
            return `
                <aside class="w-full md:w-64 bg-slate-900/70 border-r border-slate-800 flex flex-col shrink-0">
                    <div class="p-4 space-y-1 flex-1">
                        <div class="text-[11px] font-bold text-slate-500 uppercase px-3 mb-2">Modüller</div>
                        ${tabs.map(tab => `
                            <button onclick="state.activeTab='${tab.id}'; render();" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition cursor-pointer ${state.activeTab === tab.id ? 'bg-red-600 text-white font-semibold' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}">
                                <i class="fa-solid ${tab.icon} w-5 text-center"></i><span>${tab.label}</span>
                            </button>
                        `).join('')}
                    </div>
                </aside>
            `;
        }

        function renderDashboardView() {
            const approvedUsers = state.users.filter(u => u.status === 'Aktif');
            const totalFees = state.fees.reduce((sum, f) => sum + (f.amount || 0), 0);
            const pendingUsers = state.users.filter(u => u.status === 'Onay Bekliyor');
            const isY = checkIsYonetim(state.currentUser?.role);

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between"><div><p class="text-xs text-slate-400">Toplam Onaylı Üye</p><h3 class="text-2xl font-bold text-slate-100 mt-1">${approvedUsers.length}</h3></div><div class="w-12 h-12 bg-blue-950/65 border border-blue-800 text-blue-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-users"></i></div></div>
                        ${isY ? `
                            <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between"><div><p class="text-xs text-slate-400">Toplam Aidat Tahsilatı</p><h3 class="text-2xl font-bold text-slate-100 mt-1">₺${totalFees.toLocaleString()}</h3></div><div class="w-12 h-12 bg-emerald-950/65 border border-emerald-800 text-emerald-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-turkish-lira-sign"></i></div></div>
                        ` : ''}
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between"><div><p class="text-xs text-slate-400">Aktif Saha Faaliyetleri</p><h3 class="text-2xl font-bold text-slate-100 mt-1">${state.activities.length}</h3></div><div class="w-12 h-12 bg-amber-950/65 border border-amber-800 text-amber-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-person-hiking"></i></div></div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex items-center justify-between"><div><p class="text-xs text-slate-400">Onay Bekleyen Üye</p><h3 class="text-2xl font-bold text-slate-100 mt-1">${pendingUsers.length}</h3></div><div class="w-12 h-12 bg-purple-950/65 border border-purple-800 text-purple-400 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-user-clock"></i></div></div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><h4 class="font-bold text-slate-200 text-sm mb-4">Üye Kan Grubu Dağılımı</h4><div class="h-64 flex items-center justify-center"><canvas id="chartBloodGroup"></canvas></div></div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><h4 class="font-bold text-slate-200 text-sm mb-4">Aylık Aidat Tahsilat Trendi</h4><div class="h-64 flex items-center justify-center"><canvas id="chartFeeTrend"></canvas></div></div>
                    </div>
                </div>
            `;
        }

        function renderUsersView() {
            const isY = checkIsYonetim(state.currentUser?.role);
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between"><div><h2 class="text-lg font-bold text-slate-100">Dernek Üye Yönetimi</h2><p class="text-xs text-slate-400">Üye kayıtları ve yetki rolleri</p></div></div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs text-slate-300">
                                <thead class="bg-slate-950 text-slate-400 uppercase text-[10px]">
                                    <tr><th class="px-4 py-3">Ad Soyad</th><th class="px-4 py-3">Callsign</th><th class="px-4 py-3">Kan Grubu</th><th class="px-4 py-3">Telefon</th><th class="px-4 py-3">E-posta</th><th class="px-4 py-3">Rol</th><th class="px-4 py-3">Durum</th><th class="px-4 py-3 text-right">İşlem</th></tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800">
                                    ${state.users.map(u => `
                                        <tr class="hover:bg-slate-800/50">
                                            <td class="px-4 py-3 font-semibold text-slate-100">${u.full_name}</td>
                                            <td class="px-4 py-3 text-red-400 font-mono font-bold">${u.callsign || '-'}</td>
                                            <td class="px-4 py-3 text-red-400 font-bold">${u.blood || '0 Rh+'}</td>
                                            <td class="px-4 py-3 text-slate-300">${u.phone || '-'}</td>
                                            <td class="px-4 py-3 text-slate-400">${u.email}</td>

            const blood = document.getElementById('edit-blood').value;
            const phone = document.getElementById('edit-phone').value;
            const role = document.getElementById('edit-role').value;

            try {
                await supabaseClient.from('members').update({ full_name, callsign, blood, phone, role }).eq('id', id);
            } catch (err) {
                await supabaseClient.from('members').update({ full_name, callsign, role }).eq('id', id);
            }

            showNotification("Üye bilgileri güncellendi.");
            closeModal();
            await fetchAllData();
            render();
        }

            const root = document.getElementById('app');
            if (!state.currentUser) { 
                root.innerHTML = renderAuthScreen() + renderNotification() + renderGlobalDisasterModal(); 
                return; 
            }

            let content = '';
            switch(state.activeTab) {
                case 'dashboard': content = renderDashboardView(); break;
                case 'users': content = renderUsersView(); break;
                case 'fees': content = renderFeesView(); break;
                case 'radio': content = renderRadioView(); break;
                case 'reports': content = renderReportsView(); break;
                case 'activities': content = renderActivitiesView(); break;
                case 'announcements': content = renderAnnouncementsView(); break;
                case 'mobile': content = renderMobileSimulatorView(); break;
                default: content = renderDashboardView();
            }

            root.innerHTML = `
                ${renderHeader()}
                <div class="flex-1 flex flex-col md:flex-row">
                    ${renderSidebar()}
                    <main class="flex-1 p-6 overflow-y-auto">${content}</main>

                <div id="universal-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-lg shadow-2xl relative">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                            <h3 id="modal-title" class="font-bold text-lg text-red-500">Form</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div id="modal-body"></div>
                    </div>
                </div>
            `;
            setTimeout(initCharts, 50);
        }

        function initCharts() {
            if (state.activeTab === 'dashboard') {
                const ctxBlood = document.getElementById('chartBloodGroup');
                if (ctxBlood) {
                    const counts = {};
                    state.users.forEach(u => { const b = u.blood || '0 Rh+'; counts[b] = (counts[b] || 0) + 1; });
                    new Chart(ctxBlood, { type: 'doughnut', data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: ['#DC2626', '#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#6366F1'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94A3B8' } } } } });
                }
                const ctxFee = document.getElementById('chartFeeTrend');
                if (ctxFee) {
                    new Chart(ctxFee, { type: 'bar', data: { labels: ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran'], datasets: [{ label: 'Tahsilat (₺)', data: [1500, 2000, 1800, 2500, 3100, 2800], backgroundColor: '#10B981' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#94A3B8' } }, y: { ticks: { color: '#94A3B8' } } }, plugins: { legend: { labels: { color: '#94A3B8' } } } } });
                }
            }
        }

        window.onload = checkSession;
    </script>
</body>
</html>
