<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAK Acil Afet Haberleşme Derneği - Operasyon Merkezi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- AUTH CONTAINER -->
    <div id="auth-container" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex bg-red-600/20 text-red-500 p-4 rounded-2xl mb-4">
                    <i class="fa-solid fa-tower-broadcast text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">ATAK Haberleşme</h1>
                <p class="text-slate-400 text-sm mt-1">Acil Afet Derneği Yönetim ve Üye Portalı</p>
            </div>

            <div class="flex border-b border-slate-800 mb-6">
                <button type="button" id="tab-login-btn" onclick="switchAuth('login')" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-red-600 text-red-500 transition">Giriş Yap</button>
                <button type="button" id="tab-register-btn" onclick="switchAuth('register')" class="flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">Kayıt Ol</button>
            </div>

            <form id="login-form" onsubmit="handleUserLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">E-posta Adresi</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-red-600">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition">Giriş Yap</button>
            </form>

            <form id="register-form" onsubmit="handleUserRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Ad Soyad</label>
                    <input type="text" id="reg-name" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Telsiz Çağrı Adı (Callsign)</label>
                    <input type="text" id="reg-callsign" placeholder="Örn: TA3XYZ" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">E-posta Adresi</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Şifre Belirle</label>
                    <input type="password" id="reg-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 font-semibold py-2.5 rounded-lg text-sm transition">Kayıt Ol ve Başvur</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-container" class="hidden flex-1 flex flex-col lg:flex-row">
        <aside class="w-full lg:w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
            <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-red-600 p-2 rounded-lg text-white">
                        <i class="fa-solid fa-tower-broadcast"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm">ATAK Derneği</h2>
                        <p class="text-xs text-slate-400" id="user-role-badge">Yükleniyor...</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <button onclick="switchTab('dashboard')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chart-pie w-5"></i><span>Genel Bakış</span>
                </button>
                <button id="nav-members" onclick="switchTab('members')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-users w-5"></i><span>Üye Yönetimi</span>
                </button>
                <button onclick="switchTab('dues')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-wallet w-5"></i><span>Aidat Takibi</span>
                </button>
                <button onclick="switchTab('activities')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-map-location-dot w-5"></i><span>Saha Faaliyetleri</span>
                </button>
                <button onclick="switchTab('announcements')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-bullhorn w-5"></i><span>Duyurular</span>
                </button>
                <button onclick="switchTab('reports')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chart-line w-5"></i><span>Raporlar</span>
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="handleUserLogout()" class="w-full flex items-center space-x-3 px-4 py-2 rounded-lg text-sm font-medium text-red-400 hover:bg-red-500/10 transition">
                    <i class="fa-solid fa-right-from-bracket w-5"></i><span>Oturumu Kapat</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 p-6 overflow-y-auto">
            <header class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                <div class="flex items-center space-x-4">
                    <h1 id="page-title" class="text-xl font-bold">Genel Bakış</h1>
                    <div id="emergency-banner" class="hidden bg-red-600 text-white text-xs px-3 py-1.5 rounded-full font-bold animate-pulse flex items-center space-x-1">
                        <i class="fa-solid fa-triangle-exclamation"></i><span>KIRMIZI KOD / AFET MODU AKTİF</span>
                    </div>
                </div>
                <div class="text-xs text-slate-400" id="current-user-info"></div>
            </header>
            <div id="tab-content" class="space-y-6"></div>
        </main>
    </div>

    <!-- GENEL MODAL (AÇILIR PENCERE) YAPISI -->
    <div id="universal-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-lg shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h3 id="modal-title" class="font-bold text-lg text-red-500">Form</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        const SUPABASE_URL = "https://iywgxfemglgixjplenyw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FNfMMugx7kaECpYbDLkC3BA_9eeO5Py1";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        function switchAuth(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginBtn = document.getElementById('tab-login-btn');
            const registerBtn = document.getElementById('tab-register-btn');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-red-600 text-red-500 transition";
                registerBtn.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerBtn.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-500 transition";
                loginBtn.className = "flex-1 pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
            }
        }

        async function handleUserLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert("Giriş Hatası: " + error.message);
            else checkUserSession();
        }

        async function handleUserRegister(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const fullName = document.getElementById('reg-name').value;
            const callsign = document.getElementById('reg-callsign').value;

            const { data, error } = await supabaseClient.auth.signUp({
                email, password,
                options: { data: { full_name: fullName, callsign: callsign } }
            });

            if (error) {
                alert("Kayıt Hatası: " + error.message);
            } else {
                if (data.user) {
                    await supabaseClient.from('members').insert([{
                        id: data.user.id, email, full_name: fullName, callsign, role: 'Normal Üye', status: 'Onay Bekliyor'
                    }]);
                }
                alert("Kayıt başarılı! Yönetim Kurulu Başkanının onayını bekleyiniz.");
                switchAuth('login');
            }
        }

        async function handleUserLogout() {
            await supabaseClient.auth.signOut();
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                const { data: member } = await supabaseClient.from('members').select('*').eq('id', session.user.id).single();
                if (member) {
                    currentUser = member;
                    document.getElementById('user-role-badge').innerText = member.role;
                    document.getElementById('current-user-info').innerText = `${member.full_name} (${member.callsign || 'Rol Yok'})`;

                    if (!['Yönetim Kurulu Başkanı', 'Başkan Yardımcısı', 'Sayman', 'Genel Sekreter'].includes(member.role)) {
                        const mBtn = document.getElementById('nav-members');
                        if (mBtn) mBtn.style.display = 'none';
                    }
                }
                switchTab('dashboard');
            }
        }

        function isManagement() {
            return currentUser && ['Yönetim Kurulu Başkanı', 'Başkan Yardımcısı', 'Sayman'].includes(currentUser.role);
        }

        function openModal(title, htmlContent) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = htmlContent;
            document.getElementById('universal-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('universal-modal').classList.add('hidden');
        }

        function toggleEmergencyMode() {
            const banner = document.getElementById('emergency-banner');
            banner.classList.toggle('hidden');
            const isActive = !banner.classList.contains('hidden');
            alert(isActive ? "DİKKAT: Afet Modu / Kırmızı Kod tetiklendi! Tüm ekiplere bildirim gönderildi." : "Afet modu kapatıldı, normal operasyon düzenine geçildi.");
        }

        function switchTab(tabName) {
            const content = document.getElementById('tab-content');
            const title = document.getElementById('page-title');

            if (tabName === 'dashboard') {
                title.innerText = "Genel Bakış & Operasyon Merkezi";
                content.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><p class="text-slate-400 text-xs">Aktif Üyeler</p><h3 id="stat-active" class="text-2xl font-bold mt-1 text-emerald-400">-</h3></div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><p class="text-slate-400 text-xs">Bekleyen Başvuru</p><h3 id="stat-pending" class="text-2xl font-bold mt-1 text-amber-400">-</h3></div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><p class="text-slate-400 text-xs">Toplam Aidat Geliri</p><h3 id="stat-dues" class="text-2xl font-bold mt-1 text-blue-400">-</h3></div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><p class="text-slate-400 text-xs">Saha Faaliyetleri</p><h3 id="stat-activities" class="text-2xl font-bold mt-1 text-purple-400">-</h3></div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 mt-6">
                        <h3 class="font-bold text-lg mb-4 text-red-500"><i class="fa-solid fa-triangle-exclamation"></i> Acil Durum & Afet Komuta Konsolu</h3>
                        <div class="flex flex-wrap gap-4">
                            <button onclick="toggleEmergencyMode()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-5 py-3 rounded-xl text-sm transition shadow-lg">Afet / Kırmızı Kod Tetikle</button>
                            <button onclick="switchTab('activities')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-5 py-3 rounded-xl text-sm transition">Saha Görevlerini Yönet</button>
                            <button onclick="switchTab('announcements')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-5 py-3 rounded-xl text-sm transition">Duyuru Yayınla</button>
                        </div>
                    </div>
                `;
                loadDashboardStats();
            } else if (tabName === 'members') {
                title.innerText = "Üye Yönetimi ve Onaylar";
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                        <h3 class="font-bold text-lg mb-4">Dernek Üyeleri ve Başvurular</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="border-b border-slate-800 text-slate-400">
                                    <tr><th class="pb-3">Ad Soyad</th><th class="pb-3">Çağrı Adı</th><th class="pb-3">E-posta</th><th class="pb-3">Rol</th><th class="pb-3">Durum</th><th class="pb-3">İşlemler</th></tr>
                                </thead>
                                <tbody id="members-table-body">
                                    <tr><td colspan="6" class="py-4 text-center text-slate-400">Yükleniyor...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                loadMembersTable();
            } else if (tabName === 'dues') {
                title.innerText = "Aidat Takip Sistemi";
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg">Aidat Durumu ve Ödemeler</h3>
                            ${isManagement() ? `<button onclick="showAddDueModal()" class="bg-red-600 hover:bg-red-700 text-xs px-4 py-2.5 rounded-lg font-semibold transition">+ Aidat Ekle</button>` : ''}
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="border-b border-slate-800 text-slate-400">
                                    <tr><th class="pb-3">Üye Adı</th><th class="pb-3">Dönem / Ay</th><th class="pb-3">Tutar</th><th class="pb-3">Durum</th>${isManagement() ? '<th class="pb-3">İşlem</th>' : ''}</tr>
                                </thead>
                                <tbody id="dues-table-body">
                                    <tr><td colspan="5" class="py-4 text-center text-slate-400">Yükleniyor...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                loadDuesTable();
            } else if (tabName === 'activities') {
                title.innerText = "Saha Faaliyetleri ve Tatbikatlar";
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg">Afet ve Haberleşme Saha Görevleri</h3>
                            ${isManagement() ? `<button onclick="showAddActivityModal()" class="bg-red-600 hover:bg-red-700 text-xs px-4 py-2.5 rounded-lg font-semibold transition">+ Faaliyet Ekle</button>` : ''}
                        </div>
                        <div class="space-y-3" id="activities-list">
                            <p class="text-slate-400 text-sm">Faaliyetler yükleniyor...</p>
                        </div>
                    </div>
                `;
                loadActivities();
            } else if (tabName === 'announcements') {
                title.innerText = "Duyurular ve Bildirimler";
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg">Dernek İçi Duyurular</h3>
                            ${isManagement() ? `<button onclick="showAddAnnouncementModal()" class="bg-red-600 hover:bg-red-700 text-xs px-4 py-2.5 rounded-lg font-semibold transition">+ Duyuru Yayınla</button>` : ''}
                        </div>
                        <div class="space-y-3" id="announcements-list">
                            <p class="text-slate-400 text-sm">Duyurular yükleniyor...</p>
                        </div>
                    </div>
                `;
                loadAnnouncements();
            } else if (tabName === 'reports') {
                title.innerText = "Gelişmiş Raporlar ve Analizler";
                content.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                        <h3 class="font-bold text-lg mb-4">Dernek İstatistiksel Raporları</h3>
                        <p class="text-slate-400 text-sm">Üye dağılımı, aidat tahsilat performansları ve operasyonel özet raporları bu alanda yer almaktadır.</p>
                    </div>
                `;
            }
        }

        async function loadDashboardStats() {
            const { data: members } = await supabaseClient.from('members').select('*');
            if (members) {
                document.getElementById('stat-active').innerText = members.filter(m => m.status === 'Aktif').length;
                document.getElementById('stat-pending').innerText = members.filter(m => m.status === 'Onay Bekliyor').length;
            }
            const { data: dues } = await supabaseClient.from('dues').select('amount');
            const totalDues = dues ? dues.reduce((sum, d) => sum + (d.amount || 0), 0) : 0;
            document.getElementById('stat-dues').innerText = totalDues + " ₺";

            const { data: acts } = await supabaseClient.from('field_activities').select('*');
            document.getElementById('stat-activities').innerText = (acts ? acts.length : 0) + " Faaliyet";
        }

        async function loadMembersTable() {
            const { data: members } = await supabaseClient.from('members').select('*');
            const tbody = document.getElementById('members-table-body');
            if (!members) return;
            tbody.innerHTML = members.map(m => `
                <tr class="border-b border-slate-800/50 hover:bg-slate-800/20">
                    <td class="py-3 font-medium">${m.full_name}</td>
                    <td class="py-3 text-red-400 font-mono">${m.callsign || '-'}</td>
                    <td class="py-3 text-slate-400">${m.email}</td>
                    <td class="py-3">
                        <select onchange="updateMemberRole('${m.id}', this.value)" class="bg-slate-950 border border-slate-800 text-xs rounded px-2 py-1">
                            <option ${m.role === 'Normal Üye' ? 'selected' : ''}>Normal Üye</option>
                            <option ${m.role === 'Sayman' ? 'selected' : ''}>Sayman</option>
                            <option ${m.role === 'Genel Sekreter' ? 'selected' : ''}>Genel Sekreter</option>
                            <option ${m.role === 'Başkan Yardımcısı' ? 'selected' : ''}>Başkan Yardımcısı</option>
                            <option ${m.role === 'Yönetim Kurulu Başkanı' ? 'selected' : ''}>Yönetim Kurulu Başkanı</option>
                        </select>
                    </td>
                    <td class="py-3"><span class="px-2 py-1 rounded text-xs ${m.status === 'Aktif' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'}">${m.status}</span></td>
                    <td class="py-3 space-x-2">
                        ${m.status === 'Onay Bekliyor' ? `<button onclick="approveMember('${m.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-xs px-3 py-1 rounded">Onayla</button>` : ''}
                        <button onclick="deleteMember('${m.id}')" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadDuesTable() {
            let query = supabaseClient.from('dues').select('*, members(full_name)');
            if (!isManagement()) {
                query = query.eq('member_id', currentUser.id);
            }
            const { data: dues } = await query;
            const tbody = document.getElementById('dues-table-body');
            if (!dues || dues.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">Aidat kaydı bulunamadı.</td></tr>`;
                return;
            }
            tbody.innerHTML = dues.map(d => `
                <tr class="border-b border-slate-800/50 hover:bg-slate-800/20">
                    <td class="py-3 font-medium">${d.members?.full_name || 'Üye'}</td>
                    <td class="py-3">${d.period || '2026'}</td>
                    <td class="py-3 text-blue-400 font-mono">${d.amount || 0} ₺</td>
                    <td class="py-3"><span class="px-2 py-1 rounded text-xs ${d.status === 'Ödendi' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}">${d.status || 'Ödenmedi'}</span></td>
                    ${isManagement() ? `<td class="py-3"><button onclick="deleteDue('${d.id}')" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash"></i></button></td>` : ''}
                </tr>
            `).join('');
        }

        async function loadActivities() {
            const { data: acts } = await supabaseClient.from('field_activities').select('*');
            const container = document.getElementById('activities-list');
            if (!acts || acts.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-sm">Kayıtlı saha faaliyeti bulunmuyor.</p>`;
                return;
            }
            container.innerHTML = acts.map(a => `
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm text-red-400">${a.title}</h4>
                        <p class="text-xs text-slate-400 mt-1">${a.description || ''} • <span class="text-slate-300 font-semibold">${a.location || ''}</span></p>
                    </div>
                    ${isManagement() ? `<button onclick="deleteActivity('${a.id}')" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
            `).join('');
        }

        async function loadAnnouncements() {
            const { data: anns } = await supabaseClient.from('announcements').select('*');
            const container = document.getElementById('announcements-list');
            if (!anns || anns.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-sm">Aktif duyuru bulunmuyor.</p>`;
                return;
            }
            container.innerHTML = anns.map(ann => `
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm text-blue-400">${ann.title}</h4>
                        <p class="text-xs text-slate-400 mt-1">${ann.content || ''}</p>
                    </div>
                    ${isManagement() ? `<button onclick="deleteAnnouncement('${ann.id}')" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
            `).join('');
        }

        // MODAL (AÇILIR PENCERE) FORMLARI
        function showAddDueModal() {
            openModal("Yeni Aidat Kaydı Ekle", `
                <form onsubmit="handleAddDue(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Üye ID (Supabase Üye UUID)</label>
                        <input type="text" id="due-member-id" required placeholder="Üye tablosundan ID kopyalayın" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Aidat Tutarı (₺)</label>
                        <input type="number" id="due-amount" required value="500" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Dönem / Ay</label>
                        <input type="text" id="due-period" required value="Kasım 2026" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition">Kaydet</button>
                </form>
            `);
        }

        function showAddActivityModal() {
            openModal("Yeni Saha Faaliyeti Ekle", `
                <form onsubmit="handleAddActivity(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Faaliyet Başlığı</label>
                        <input type="text" id="act-title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Açıklama</label>
                        <textarea id="act-desc" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Konum / Bölge</label>
                        <input type="text" id="act-loc" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition">Faaliyeti Kaydet</button>
                </form>
            `);
        }

        function showAddAnnouncementModal() {
            openModal("Yeni Duyuru Yayınla", `
                <form onsubmit="handleAddAnnouncement(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Duyuru Başlığı</label>
                        <input type="text" id="ann-title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">İçerik</label>
                        <textarea id="ann-content" rows="4" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-red-600"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 rounded-lg text-sm transition">Duyuruyu Yayınla</button>
                </form>
            `);
        }

        // VERİTABANI EKLEME VE SİLME FONKSİYONLARI
        async function handleAddDue(e) {
            e.preventDefault();
            const member_id = document.getElementById('due-member-id').value;
            const amount = parseFloat(document.getElementById('due-amount').value);
            const period = document.getElementById('due-period').value;

            const { error } = await supabaseClient.from('dues').insert([{ member_id, amount, period, status: 'Ödendi' }]);
            if (error) alert("Hata: " + error.message);
            else {
                closeModal();
                loadDuesTable();
            }
        }

        async function handleAddActivity(e) {
            e.preventDefault();
            const title = document.getElementById('act-title').value;
            const description = document.getElementById('act-desc').value;
            const location = document.getElementById('act-loc').value;

            const { error } = await supabaseClient.from('field_activities').insert([{ title, description, location }]);
            if (error) alert("Hata: " + error.message);
            else {
                closeModal();
                loadActivities();
            }
        }

        async function handleAddAnnouncement(e) {
            e.preventDefault();
            const title = document.getElementById('ann-title').value;
            const content = document.getElementById('ann-content').value;

            const { error } = await supabaseClient.from('announcements').insert([{ title, content }]);
            if (error) alert("Hata: " + error.message);
            else {
                closeModal();
                loadAnnouncements();
            }
        }

        async function deleteDue(id) {
            if (confirm("Bu aidat kaydını silmek istediğinize emin misiniz?")) {
                await supabaseClient.from('dues').delete().eq('id', id);
                loadDuesTable();
            }
        }

        async function deleteActivity(id) {
            if (confirm("Bu faaliyeti silmek istediğinize emin misiniz?")) {
                await supabaseClient.from('field_activities').delete().eq('id', id);
                loadActivities();
            }
        }

        async function deleteAnnouncement(id) {
            if (confirm("Bu duyuruyu silmek istediğinize emin misiniz?")) {
                await supabaseClient.from('announcements').delete().eq('id', id);
                loadAnnouncements();
            }
        }

        window.approveMember = async function(id) {
            await supabaseClient.from('members').update({ status: 'Aktif' }).eq('id', id);
            loadMembersTable();
        };

        window.updateMemberRole = async function(id, role) {
            await supabaseClient.from('members').update({ role: role }).eq('id', id);
        };

        window.deleteMember = async function(id) {
            if (confirm("Bu üyeyi silmek istediğinize emin misiniz?")) {
                await supabaseClient.from('members').delete().eq('id', id);
                loadMembersTable();
            }
        };

        window.onload = checkUserSession;
    </script>
</body>
</html>
